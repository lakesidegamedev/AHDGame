name: E2E nightly

# Browser tests against a built server and an isolated Mongo replica set.
# Not a required check: it gives a nightly signal on the Playwright specs in
# e2e/ without gating merges. Run it by hand with workflow_dispatch.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/e2e-nightly.yml"
      - "playwright.config.ts"
      - "e2e/**"

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start isolated Mongo replica set
        run: |
          mongo_image=mirror.gcr.io/library/mongo:8.0
          kernel="$(uname -r | cut -d- -f1)"
          # MongoDB 8.0 refuses to start on Linux 6.19+ (SERVER-121912).
          if [ "$(printf "%s\n" 6.19 "$kernel" | sort -V | head -n1)" = 6.19 ]; then
            mongo_image=mirror.gcr.io/library/mongo:7.0
          fi
          pulled=0
          for attempt in 1 2 3; do
            if docker pull "$mongo_image"; then pulled=1; break; fi
            sleep $((attempt * 10))
          done
          if [ "$pulled" != 1 ]; then
            mongo_image="docker.io/library/${mongo_image#mirror.gcr.io/library/}"
            docker pull "$mongo_image"
          fi
          docker run --detach --name e2e-mongo --publish 27992:27017 "$mongo_image" --replSet e2eReplica --bind_ip_all
          mongo_started=0
          for attempt in $(seq 1 90); do
            if [ "$(docker inspect --format '{{.State.Running}}' e2e-mongo)" != true ]; then
              echo "::error::Mongo container exited during startup"; docker logs --tail 100 e2e-mongo; exit 1
            fi
            if node -e 'const {MongoClient}=require("mongodb");const c=new MongoClient("mongodb://127.0.0.1:27992/?directConnection=true",{serverSelectionTimeoutMS:1000});c.db("admin").command({ping:1}).then(()=>process.exit(0),()=>process.exit(1))'; then mongo_started=1; break; fi
            sleep 1
          done
          if [ "$mongo_started" != 1 ]; then echo "::error::Mongo did not accept connections within 90 seconds"; exit 1; fi
          for attempt in $(seq 1 30); do
            if docker exec e2e-mongo mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'; then break; fi
            sleep 1
          done
          docker exec e2e-mongo mongosh --quiet --eval 'rs.initiate({_id: "e2eReplica", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec e2e-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo "::error::Mongo replica set never became primary"; exit 1; fi
      - name: Next build
        run: npm run verify:build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CI: "true"
          NEXT_BUILD_CPUS: "1"
      - name: Start the app
        run: |
          nohup npm run start > app.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then exit 0; fi
            sleep 2
          done
          echo "::error::App did not answer within 180 seconds"
          tail -n 100 app.log
          exit 1
        env:
          MONGODB_URI: mongodb://127.0.0.1:27992/e2e?replicaSet=e2eReplica&directConnection=true
          AUTH_SECRET: e2e-only-secret-not-used-anywhere-else
          ADMIN_REGISTRATION_KEY: e2e-only-admin-key
          CRON_SECRET: e2e-only-cron-secret
          NEXT_TELEMETRY_DISABLED: "1"
      # Snapshot baselines are not committed, so image comparisons are skipped.
      - name: Run Playwright specs
        run: npx playwright test --ignore-snapshots
        env:
          CI: "true"
          E2E_SERVER_READY: "1"
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            app.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop isolated Mongo
        if: always()
        run: docker rm --force e2e-mongo || true
