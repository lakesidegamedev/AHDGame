<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" font-family="system-ui, sans-serif"><title>Primary timeline</title><desc>A primary opens at spawn, the declaration window closes after a fixed time, ballots count over the closing stretch, and at the deadline the cumulative count decides who advances. Not to scale.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="759" height="259" rx="8" fill="#ffffff" stroke="#d4d4d8"/><text x="20" y="28" font-size="12" text-anchor="start" fill="#52525b">Not to scale</text><rect x="40" y="80" width="160" height="26" rx="4" fill="#f4f4f5" stroke="#d4d4d8"/><rect x="200" y="80" width="280" height="26" rx="4" fill="#f4f4f5" stroke="#d4d4d8"/><rect x="480" y="80" width="240" height="26" rx="4" fill="#eff6ff" stroke="#2563eb"/><text x="120" y="98" font-size="12" text-anchor="middle" fill="#18181b">You can declare</text><text x="340" y="98" font-size="12" text-anchor="middle" fill="#18181b">Standings scored every turn</text><text x="600" y="98" font-size="12" text-anchor="middle" fill="#18181b" font-weight="bold">Ballots count</text><line x1="40" y1="106" x2="40" y2="130" stroke="#71717a"/><line x1="200" y1="106" x2="200" y2="130" stroke="#71717a"/><line x1="480" y1="106" x2="480" y2="130" stroke="#71717a"/><line x1="720" y1="106" x2="720" y2="130" stroke="#71717a"/><text x="40" y="148" font-size="13" text-anchor="start" fill="#18181b" font-weight="bold">Cycle spawns</text><text x="210" y="148" font-size="13" text-anchor="start" fill="#18181b" font-weight="bold">Declaration closes</text><text x="210" y="166" font-size="12" text-anchor="start" fill="#52525b">House: 48 hours after spawn</text><text x="210" y="182" font-size="12" text-anchor="start" fill="#52525b">Senate: 240 hours after spawn</text><text x="480" y="148" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">Ballot window opens</text><text x="480" y="166" font-size="12" text-anchor="middle" fill="#52525b">the last 48 turns</text><text x="720" y="148" font-size="13" text-anchor="end" fill="#18181b" font-weight="bold">Deadline</text><text x="720" y="166" font-size="12" text-anchor="end" fill="#52525b">cumulative count decides</text><text x="720" y="182" font-size="12" text-anchor="end" fill="#52525b">winner moves to the general</text></svg>