<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" font-family="system-ui, sans-serif">
<title>NPP force sum</title>
<desc>An NPP adds ideology, whip, party line, district and donors into one total. Above plus 5 it votes For, below minus 5 Against, and from minus 5 to plus 5 it abstains.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="379" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<text x="18" y="28" font-size="15" fill="#18181b" text-anchor="start" font-weight="700">How an NPP decides a vote</text>
<rect x="20" y="46" width="280" height="48" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="160.0" y="65.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Ideology</text>
<text x="160.0" y="82.0" font-size="13" fill="#18181b" text-anchor="middle">-100 to +100</text>
<path d="M300 70 L372 70" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="20" y="106" width="280" height="48" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="160.0" y="125.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Whip</text>
<text x="160.0" y="142.0" font-size="13" fill="#18181b" text-anchor="middle">-100 to +100, scaled by compliance</text>
<path d="M300 130 L372 130" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="20" y="166" width="280" height="48" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="160.0" y="185.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Party line</text>
<text x="160.0" y="202.0" font-size="13" fill="#18181b" text-anchor="middle">0 to +20, sponsor's own party only</text>
<path d="M300 190 L372 190" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="20" y="226" width="280" height="48" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="160.0" y="245.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">District</text>
<text x="160.0" y="262.0" font-size="13" fill="#18181b" text-anchor="middle">-100 to +100</text>
<path d="M300 250 L372 250" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="20" y="286" width="280" height="48" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="160.0" y="305.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Donors</text>
<text x="160.0" y="322.0" font-size="13" fill="#18181b" text-anchor="middle">-100 to +100</text>
<path d="M300 310 L372 310" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="372" y="46" width="64" height="288" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="404.0" y="193.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Total</text>
<rect x="520" y="64" width="220" height="64" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="630.0" y="91.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">For</text>
<text x="630.0" y="108.0" font-size="13" fill="#18181b" text-anchor="middle">Above +5</text>
<path d="M436 96 L520 96" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="520" y="160" width="220" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="630.0" y="187.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Abstain</text>
<text x="630.0" y="204.0" font-size="13" fill="#18181b" text-anchor="middle">-5 to +5, inclusive</text>
<path d="M436 192 L520 192" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#mn)"/>
<rect x="520" y="256" width="220" height="64" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="630.0" y="283.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Against</text>
<text x="630.0" y="300.0" font-size="13" fill="#18181b" text-anchor="middle">Below -5</text>
<path d="M436 288 L520 288" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="20" y="362" font-size="12" fill="#52525b" text-anchor="start">There is no dice roll in the vote itself. Only a hard whip rolls once.</text>
</svg>
