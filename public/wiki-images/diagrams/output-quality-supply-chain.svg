<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" font-family="system-ui, sans-serif"><title>Quality moves up the supply chain</title><desc>Raw extraction carries no quality score; manufacturers and consumer goods sectors read the average quality of the commodities they buy through their inputs pillar.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="759" height="259" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="60" width="170" height="100" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="105.0" y="97.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">Raw extraction</text><text x="105.0" y="113.0" font-size="13" text-anchor="middle" fill="#18181b">ore and crude, no</text><text x="105.0" y="129.0" font-size="13" text-anchor="middle" fill="#18181b">quality score</text><rect x="290" y="40" width="190" height="150" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="385" y="62" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">Manufacturers</text><rect x="305" y="80" width="160" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="385.0" y="103.0" font-size="13" text-anchor="middle" fill="#18181b">Inputs pillar</text><text x="385" y="148" font-size="12" text-anchor="middle" fill="#52525b">also tech, wages,</text><text x="385" y="164" font-size="12" text-anchor="middle" fill="#52525b">and operations</text><rect x="540" y="40" width="190" height="150" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="635" y="62" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">Consumer goods sectors</text><rect x="555" y="80" width="160" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="635.0" y="103.0" font-size="13" text-anchor="middle" fill="#18181b">Inputs pillar</text><text x="635" y="148" font-size="12" text-anchor="middle" fill="#52525b">also tech, wages,</text><text x="635" y="164" font-size="12" text-anchor="middle" fill="#52525b">and operations</text><path d="M190 100 L305 100" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="248" y="86" font-size="12" text-anchor="middle" fill="#52525b">raw goods</text><path d="M480 170 L510 170 L510 100 L555 100" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="510" y="205" font-size="12" text-anchor="middle" fill="#52525b">average quality of each commodity,</text><text x="510" y="221" font-size="12" text-anchor="middle" fill="#52525b">as made last turn</text></svg>