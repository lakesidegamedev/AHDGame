<text x="541.0" y="187.0" font-size="13" fill="#18181b" text-anchor="middle">rebuilding</text>
<text x="541.0" y="204.0" font-size="13" fill="#18181b" text-anchor="middle">Choose replacement</text>
<text x="541.0" y="221.0" font-size="13" fill="#18181b" text-anchor="middle">mode</text>
<text x="541.0" y="238.0" font-size="13" fill="#18181b" text-anchor="middle">Watch supply</text>
<text x="541.0" y="255.0" font-size="13" fill="#18181b" text-anchor="middle">Allies join</text>
<rect x="470" y="302" width="142" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="541.0" y="321.0" font-size="12" fill="#18181b" text-anchor="middle" font-weight="700">Explained on</text>
<text x="541.0" y="337.0" font-size="12" fill="#18181b" text-anchor="middle">Manpower and</text>
<text x="541.0" y="353.0" font-size="12" fill="#18181b" text-anchor="middle">Fighting a Battle</text>
