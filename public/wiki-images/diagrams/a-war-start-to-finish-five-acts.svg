<text x="389.0" y="212.5" font-size="13" fill="#18181b" text-anchor="middle">Read the war room</text>
<text x="389.0" y="229.5" font-size="13" fill="#18181b" text-anchor="middle">Declare an</text>
<text x="389.0" y="246.5" font-size="13" fill="#18181b" text-anchor="middle">offensive</text>
