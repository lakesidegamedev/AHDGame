<rect x="14" y="128" width="142" height="162" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="85.0" y="170.0" font-size="13" fill="#18181b" text-anchor="middle">Recruit units</text>
<text x="85.0" y="187.0" font-size="13" fill="#18181b" text-anchor="middle">Spend doctrine</text>
<text x="85.0" y="204.0" font-size="13" fill="#18181b" text-anchor="middle">points</text>
<text x="85.0" y="221.0" font-size="13" fill="#18181b" text-anchor="middle">Commission</text>
<text x="85.0" y="238.0" font-size="13" fill="#18181b" text-anchor="middle">generals</text>
<text x="85.0" y="255.0" font-size="13" fill="#18181b" text-anchor="middle">Build Commands</text>
<rect x="14" y="302" width="142" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
