<text x="237.0" y="75.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">declaration</text>
<text x="237.0" y="92.0" font-size="13" fill="#18181b" text-anchor="middle">Turns 1,150 to</text>
<text x="237.0" y="109.0" font-size="13" fill="#18181b" text-anchor="middle">1,180</text>
