<text x="693.0" y="83.5" font-size="13" fill="#18181b" text-anchor="middle">Turns 1,600 to</text>
<text x="693.0" y="100.5" font-size="13" fill="#18181b" text-anchor="middle">1,700</text>
<rect x="622" y="128" width="142" height="162" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="693.0" y="187.0" font-size="13" fill="#18181b" text-anchor="middle">War winds down</text>
<text x="693.0" y="204.0" font-size="13" fill="#18181b" text-anchor="middle">Offer a settlement</text>
<text x="693.0" y="221.0" font-size="13" fill="#18181b" text-anchor="middle">Accept or reject</text>
<text x="693.0" y="238.0" font-size="13" fill="#18181b" text-anchor="middle">A truce begins</text>
<rect x="622" y="302" width="142" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
