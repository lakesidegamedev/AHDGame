<svg xmlns="http://www.w3.org/2000/svg" width="740" height="350" viewBox="0 0 740 350" role="img" font-family="system-ui, sans-serif">
<title>Cabinet seat lifecycle</title>
<desc>A vacant cabinet seat is filled by presidential nomination and a 24 hour Senate vote, or temporarily by an acting secretary, or directly by appointment.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="739" height="349" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<g fill="#18181b">
<rect x="24" y="40" width="120" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="84.0" y="72.5" font-size="13" text-anchor="middle">Seat vacant</text>
<rect x="194" y="40" width="150" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="269.0" y="64.0" font-size="13" text-anchor="middle" font-weight="700">President</text>
<text x="269.0" y="81.0" font-size="13" text-anchor="middle">nominates</text>
<rect x="394" y="40" width="150" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="469.0" y="64.0" font-size="13" text-anchor="middle" font-weight="700">Senate vote</text>
<text x="469.0" y="81.0" font-size="13" text-anchor="middle">24 hours</text>
<rect x="614" y="40" width="102" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="665.0" y="72.5" font-size="13" text-anchor="middle">Seat filled</text>
<polyline points="144,68 194,68" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<polyline points="344,68 394,68" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<polyline points="544,68 614,68" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="579" y="60" font-size="12" text-anchor="middle" fill="#52525b">confirmed</text>
<rect x="394" y="150" width="150" height="56" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="469.0" y="174.2" font-size="12" text-anchor="middle" font-weight="700">Rejected or tied</text>
<text x="469.0" y="190.2" font-size="12" text-anchor="middle">seat stays vacant</text>
<polyline points="469,96 469,150" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="477" y="128" font-size="12" text-anchor="start" fill="#52525b">rejected</text>
<rect x="24" y="150" width="190" height="86" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="119.0" y="165.2" font-size="12" text-anchor="middle" font-weight="700">Acting secretary</text>
<text x="119.0" y="181.2" font-size="12" text-anchor="middle">No Senate vote. Lasts 24</text>
<text x="119.0" y="197.2" font-size="12" text-anchor="middle">turns, once per seat per</text>
<text x="119.0" y="213.2" font-size="12" text-anchor="middle">presidency. Confirmation</text>
<text x="119.0" y="229.2" font-size="12" text-anchor="middle">replaces them at once.</text>
<polyline points="84,96 84,150" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="92" y="128" font-size="12" text-anchor="start" fill="#52525b">vacant seat</text>
<rect x="376" y="260" width="340" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="546.0" y="280.2" font-size="12" text-anchor="middle" font-weight="700">Direct appointment</text>
<text x="546.0" y="296.2" font-size="12" text-anchor="middle">White House Chief of Staff: the President alone.</text>
<text x="546.0" y="312.2" font-size="12" text-anchor="middle">Parliamentary countries: the PM appoints.</text>
<polyline points="655,260 655,96" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="662" y="190" font-size="12" text-anchor="start" fill="#52525b">no vote</text>
</g>
</svg>
