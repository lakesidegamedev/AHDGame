<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" font-family="system-ui, sans-serif">
<title>What each regime tier can do</title>
<desc>A matrix of Ruling, Approved and Banned party tiers against what each can do, with the vote multiplier for each.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="719" height="329" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<g fill="#18181b">
<text x="24" y="30" font-size="15" text-anchor="start" fill="#18181b" font-weight="700">Party regime tier</text>
<rect x="278" y="44" width="132" height="34" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="344.0" y="65.5" font-size="13" text-anchor="middle">Ruling</text>
<rect x="418" y="44" width="132" height="34" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="484.0" y="65.5" font-size="13" text-anchor="middle">Approved</text>
<rect x="558" y="44" width="132" height="34" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="624.0" y="65.5" font-size="13" text-anchor="middle">Banned</text>
<rect x="24" y="86" width="670" height="30" fill="#f4f4f5"/>
<text x="34" y="106" font-size="13" text-anchor="start" fill="#18181b">Form government</text>
<text x="344.0" y="106" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="700">Yes</text>
<text x="484.0" y="106" font-size="13" text-anchor="middle" fill="#52525b" font-weight="700">No</text>
<text x="624.0" y="106" font-size="13" text-anchor="middle" fill="#52525b" font-weight="700">No</text>
<text x="34" y="136" font-size="13" text-anchor="start" fill="#18181b">Field executive candidates</text>
<text x="344.0" y="136" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="700">Yes</text>
<text x="484.0" y="136" font-size="13" text-anchor="middle" fill="#52525b" font-weight="700">No</text>
<text x="624.0" y="136" font-size="13" text-anchor="middle" fill="#52525b" font-weight="700">No</text>
<rect x="24" y="146" width="670" height="30" fill="#f4f4f5"/>
<text x="34" y="166" font-size="13" text-anchor="start" fill="#18181b">Propose and vote on bills</text>
<text x="344.0" y="166" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="700">Yes</text>
<text x="484.0" y="166" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="700">Yes</text>
<text x="624.0" y="166" font-size="13" text-anchor="middle" fill="#52525b" font-weight="700">No</text>
<text x="34" y="196" font-size="13" text-anchor="start" fill="#18181b">Hold cabinet seats</text>
<text x="344.0" y="196" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="700">Yes</text>
<text x="484.0" y="196" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="700">Yes</text>
<text x="624.0" y="196" font-size="13" text-anchor="middle" fill="#52525b" font-weight="700">No</text>
<rect x="24" y="206" width="670" height="30" fill="#f4f4f5"/>
<text x="34" y="226" font-size="13" text-anchor="start" fill="#18181b">Form or join coalitions</text>
<text x="344.0" y="226" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="700">Yes</text>
<text x="484.0" y="226" font-size="13" text-anchor="middle" fill="#52525b" font-weight="700">No</text>
<text x="624.0" y="226" font-size="13" text-anchor="middle" fill="#52525b" font-weight="700">No</text>
<text x="34" y="256" font-size="13" text-anchor="start" fill="#18181b">Take donations</text>
<text x="344.0" y="256" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="700">Yes</text>
<text x="484.0" y="256" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="700">Yes</text>
<text x="624.0" y="256" font-size="13" text-anchor="middle" fill="#52525b" font-weight="700">No</text>
<rect x="24" y="266" width="670" height="30" fill="#f4f4f5"/>
<text x="34" y="286" font-size="13" text-anchor="start" fill="#18181b" font-weight="700">Vote multiplier in elections</text>
<text x="344.0" y="286" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="700">3.0</text>
<text x="484.0" y="286" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="700">0.375</text>
<text x="624.0" y="286" font-size="13" text-anchor="middle" fill="#52525b" font-weight="700">0</text>
<text x="24" y="324" font-size="12" text-anchor="start" fill="#52525b">Independents have a vote multiplier of 0, like banned parties.</text>
</g>
</svg>
