<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" font-family="system-ui, sans-serif">
<title>Leadership tenure timeline</title>
<desc>A worked timeline: joining at turn 500 unlocks national leadership at turn 524, relocating at turn 600 unlocks state party leadership at turn 624.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="719" height="259" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<text x="18" y="28" font-size="15" fill="#18181b" text-anchor="start" font-weight="700">Two separate 24 turn clocks</text>
<line x1="40" y1="130" x2="690" y2="130" stroke="#a1a1aa" stroke-width="2"/>
<line x1="50.0" y1="130" x2="162.8" y2="130" stroke="#2563eb" stroke-width="5"/>
<line x1="520.0" y1="130" x2="632.8000000000001" y2="130" stroke="#2563eb" stroke-width="5"/>
<circle cx="50.0" cy="130" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="162.8" cy="130" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="520.0" cy="130" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="632.8000000000001" cy="130" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="44.0" y="76" font-size="13" fill="#18181b" text-anchor="start" font-weight="700">Turn 500</text>
<text x="44.0" y="93" font-size="13" fill="#18181b" text-anchor="start">Join the party</text>
<text x="164.8" y="76" font-size="13" fill="#18181b" text-anchor="start" font-weight="700">Turn 524</text>
<text x="164.8" y="93" font-size="13" fill="#18181b" text-anchor="start">Can run and vote</text>
<text x="164.8" y="110" font-size="13" fill="#18181b" text-anchor="start">nationally</text>
<text x="514.0" y="170" font-size="13" fill="#18181b" text-anchor="start" font-weight="700">Turn 600</text>
<text x="514.0" y="187" font-size="13" fill="#18181b" text-anchor="start">Relocate to a</text>
<text x="514.0" y="204" font-size="13" fill="#18181b" text-anchor="start">new state</text>
<text x="626.8000000000001" y="170" font-size="13" fill="#18181b" text-anchor="start" font-weight="700">Turn 624</text>
<text x="626.8000000000001" y="187" font-size="13" fill="#18181b" text-anchor="start">Can lead the</text>
<text x="626.8000000000001" y="204" font-size="13" fill="#18181b" text-anchor="start">state party</text>
<text x="106.4" y="148" font-size="12" fill="#2563eb" text-anchor="middle">24 turns</text>
<text x="576.4000000000001" y="148" font-size="12" fill="#2563eb" text-anchor="middle">24 turns</text>
<text x="18" y="240" font-size="12" fill="#52525b" text-anchor="start">Joining or switching restarts the national clock. A merger does not. Relocating does not touch it.</text>
</svg>
