<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" font-family="system-ui, sans-serif">
<title>FOMC meeting flow</title>
<desc>A meeting opens when due, the chair's automatic motion is set, NPP seats vote at once, player governors vote within 24 hours, and a strict majority of seated governors passes it and moves the rate.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker></defs>
<rect x="0.5" y="0.5" width="779" height="459" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="36" width="165" height="120" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="102.5" y="75.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">1. Meeting due</text>
<text x="102.5" y="92.0" text-anchor="middle" font-size="13" fill="#18181b">every 8 turns, with</text>
<text x="102.5" y="109.0" text-anchor="middle" font-size="13" fill="#18181b">at least one</text>
<text x="102.5" y="126.0" text-anchor="middle" font-size="13" fill="#18181b">governor seated</text>
<rect x="205" y="36" width="165" height="120" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="287.5" y="58.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">2. Motion set</text>
<text x="287.5" y="75.0" text-anchor="middle" font-size="13" fill="#18181b">chair's reading of</text>
<text x="287.5" y="92.0" text-anchor="middle" font-size="13" fill="#18181b">inflation and</text>
<text x="287.5" y="109.0" text-anchor="middle" font-size="13" fill="#18181b">growth: hike, cut or</text>
<text x="287.5" y="126.0" text-anchor="middle" font-size="13" fill="#18181b">hold (hold if capped</text>
<text x="287.5" y="143.0" text-anchor="middle" font-size="13" fill="#18181b">or waiting)</text>
<rect x="390" y="36" width="165" height="120" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="472.5" y="83.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">3. NPP seats vote</text>
<text x="472.5" y="100.5" text-anchor="middle" font-size="13" fill="#18181b">at once, leaning</text>
<text x="472.5" y="117.5" text-anchor="middle" font-size="13" fill="#18181b">hawk or dove</text>
<rect x="575" y="36" width="165" height="120" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="657.5" y="83.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">4. Players vote</text>
<text x="657.5" y="100.5" text-anchor="middle" font-size="13" fill="#18181b">within 24 hours; no</text>
<text x="657.5" y="117.5" text-anchor="middle" font-size="13" fill="#18181b">ballot is an abstain</text>
<path d="M185,96 L205,96" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M370,96 L390,96" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M555,96 L575,96" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M657,156 L657,210" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="540" y="210" width="200" height="110" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
<text x="640.0" y="227.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">5. Decided</text>
<text x="640.0" y="244.0" text-anchor="middle" font-size="13" fill="#18181b">as soon as it has a</text>
<text x="640.0" y="261.0" text-anchor="middle" font-size="13" fill="#18181b">strict majority of seated</text>
<text x="640.0" y="278.0" text-anchor="middle" font-size="13" fill="#18181b">governors, or cannot</text>
<text x="640.0" y="295.0" text-anchor="middle" font-size="13" fill="#18181b">reach one; never on the</text>
<text x="640.0" y="312.0" text-anchor="middle" font-size="13" fill="#18181b">turn it opened</text>
<path d="M540,265 L430,265" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<text x="485" y="258" text-anchor="middle" font-size="12" fill="#52525b" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">passes</text>
<rect x="240" y="235" width="190" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
<text x="335.0" y="252.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Rate moves</text>
<text x="335.0" y="269.5" text-anchor="middle" font-size="13" fill="#18181b">counts toward 16 changes</text>
<text x="335.0" y="286.5" text-anchor="middle" font-size="13" fill="#18181b">per term</text>
<path d="M640,320 L640,365" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mw)"/>
<text x="648" y="348" text-anchor="start" font-size="12" fill="#52525b" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">fails</text>
<rect x="540" y="365" width="200" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.25"/>
<text x="640.0" y="391.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Motion fails</text>
<text x="640.0" y="408.0" text-anchor="middle" font-size="13" fill="#18181b">the rate stays the same</text>
<text x="20" y="440" text-anchor="start" font-size="12" fill="#52525b" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">Vacant seats do not count toward the majority.</text>
</svg>
