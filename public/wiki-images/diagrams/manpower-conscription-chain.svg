<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" font-family="system-ui, sans-serif">
<title>Manpower chain</title>
<desc>The reserve law level sets the conscription stance, which sets the ceiling and regeneration of the manpower pool. The pool is a hard block on recruiting and also feeds replacement of losses, whose mode decides the experience of replacements.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="419" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<text x="18" y="28" font-size="15" fill="#18181b" text-anchor="start" font-weight="700">From law to army</text>
<rect x="20" y="44" width="165" height="76" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="102.5" y="77.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Reserve law</text>
<text x="102.5" y="94.0" font-size="13" fill="#18181b" text-anchor="middle">level 0 to 4</text>
<rect x="205" y="44" width="165" height="76" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="287.5" y="68.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Stance</text>
<text x="287.5" y="85.5" font-size="13" fill="#18181b" text-anchor="middle">five rungs, volunteer</text>
<text x="287.5" y="102.5" font-size="13" fill="#18181b" text-anchor="middle">to universal</text>
<rect x="390" y="44" width="165" height="76" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="472.5" y="60.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Ceiling and</text>
<text x="472.5" y="77.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">regeneration</text>
<text x="472.5" y="94.0" font-size="13" fill="#18181b" text-anchor="middle">scale with population</text>
<text x="472.5" y="111.0" font-size="13" fill="#18181b" text-anchor="middle">and stance</text>
<rect x="575" y="44" width="165" height="76" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="657.5" y="68.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Manpower pool</text>
<text x="657.5" y="85.5" font-size="13" fill="#18181b" text-anchor="middle">one pool for the</text>
<text x="657.5" y="102.5" font-size="13" fill="#18181b" text-anchor="middle">nation</text>
<path d="M185 82 L205 82" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M370 82 L390 82" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M555 82 L575 82" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="450" y="190" width="290" height="84" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="595.0" y="210.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Recruiting: hard block</text>
<text x="595.0" y="227.0" font-size="13" fill="#18181b" text-anchor="middle">A unit's full establishment must be in</text>
<text x="595.0" y="244.0" font-size="13" fill="#18181b" text-anchor="middle">the pool. Refused if short, no</text>
<text x="595.0" y="261.0" font-size="13" fill="#18181b" text-anchor="middle">borrowing</text>
<path d="M660 120 L660 190" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="20" y="190" width="330" height="84" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="185.0" y="218.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Replacement mode</text>
<text x="185.0" y="235.5" font-size="13" fill="#18181b" text-anchor="middle">Off, Trained or Conscript. Conscript needs a</text>
<text x="185.0" y="252.5" font-size="13" fill="#18181b" text-anchor="middle">stance that allows drafting</text>
<path d="M600 120 L600 150 L185 150 L185 190" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="308.8" y="133" width="182.4" height="15" fill="#ffffff"/>
<text x="400" y="144" font-size="12" fill="#52525b" text-anchor="middle">refills under-strength units</text>
<rect x="20" y="320" width="330" height="76" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="185.0" y="344.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Experience dilution</text>
<text x="185.0" y="361.5" font-size="13" fill="#18181b" text-anchor="middle">Trained: arrive with real experience.</text>
<text x="185.0" y="378.5" font-size="13" fill="#18181b" text-anchor="middle">Conscript: arrive with none</text>
<path d="M185 274 L185 320" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
</svg>
