<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" font-family="system-ui, sans-serif"><title>Default naval orders</title><desc>The order in which the game picks a default posture for a formation with no orders: first matching rule wins.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="419" rx="8" fill="#ffffff" stroke="#d4d4d8"/><text x="20" y="28" font-size="13" text-anchor="start" fill="#52525b">Checked top to bottom. The first rule that matches sets the order.</text><rect x="20" y="50" width="360" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="200.0" y="73.0" font-size="13" text-anchor="middle" fill="#18181b">Condition under 35 or readiness under 25?</text><rect x="470" y="50" width="200" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="570.0" y="73.0" font-size="13" text-anchor="middle" fill="#18181b">Return to Port</text><path d="M380 70 L470 70" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="425" y="63" font-size="12" text-anchor="middle" fill="#52525b">yes</text><path d="M200 90 L200 108" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="212" y="103" font-size="12" text-anchor="start" fill="#52525b">no</text><rect x="20" y="108" width="360" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="200.0" y="131.0" font-size="13" text-anchor="middle" fill="#18181b">Peacetime, no enemies?</text><rect x="470" y="108" width="200" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="570.0" y="131.0" font-size="13" text-anchor="middle" fill="#18181b">Port</text><path d="M380 128 L470 128" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="425" y="121" font-size="12" text-anchor="middle" fill="#52525b">yes</text><path d="M200 148 L200 166" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="212" y="161" font-size="12" text-anchor="start" fill="#52525b">no</text><rect x="20" y="166" width="360" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="200.0" y="189.0" font-size="13" text-anchor="middle" fill="#18181b">Hostile fleet in the same region?</text><rect x="470" y="166" width="200" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="570.0" y="189.0" font-size="13" text-anchor="middle" fill="#18181b">Sea Control</text><path d="M380 186 L470 186" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="425" y="179" font-size="12" text-anchor="middle" fill="#52525b">yes</text><path d="M200 206 L200 224" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="212" y="219" font-size="12" text-anchor="start" fill="#52525b">no</text><rect x="20" y="224" width="360" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="200.0" y="247.0" font-size="13" text-anchor="middle" fill="#18181b">Submarine?</text><rect x="470" y="224" width="200" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="570.0" y="247.0" font-size="13" text-anchor="middle" fill="#18181b">Sea Denial</text><path d="M380 244 L470 244" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="425" y="237" font-size="12" text-anchor="middle" fill="#52525b">yes</text><path d="M200 264 L200 282" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="212" y="277" font-size="12" text-anchor="start" fill="#52525b">no</text><rect x="20" y="282" width="360" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="200.0" y="305.0" font-size="13" text-anchor="middle" fill="#18181b">Station on an enemy trade approach?</text><rect x="470" y="282" width="200" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="570.0" y="305.0" font-size="13" text-anchor="middle" fill="#18181b">Blockade</text><path d="M380 302 L470 302" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="425" y="295" font-size="12" text-anchor="middle" fill="#52525b">yes</text><path d="M200 322 L200 340" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="212" y="335" font-size="12" text-anchor="start" fill="#52525b">no</text><rect x="20" y="340" width="360" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="200.0" y="363.0" font-size="13" text-anchor="middle" fill="#18181b">Nothing above matched</text><rect x="470" y="340" width="200" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="570.0" y="363.0" font-size="13" text-anchor="middle" fill="#18181b">Transit</text><path d="M380 360 L470 360" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="425" y="353" font-size="12" text-anchor="middle" fill="#52525b">otherwise</text></svg>