<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" font-family="system-ui, sans-serif"><title>When a region is called</title><desc>Decision order for calling a reporting unit: tied or no votes means no call; ended election means called; final-hour reveal with a lead of at least 5 points means called; otherwise only the lead shows.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="349" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="20" width="360" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="200.0" y="45.0" font-size="13" text-anchor="middle" fill="#18181b">Is the region tied?</text><rect x="470" y="20" width="200" height="44" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="570.0" y="45.0" font-size="13" text-anchor="middle" fill="#18181b">No call</text><path d="M380 42 L470 42" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arw)"/><text x="425" y="35" font-size="12" text-anchor="middle" fill="#52525b">yes</text><path d="M200 64 L200 84" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="212" y="78" font-size="12" text-anchor="start" fill="#52525b">no</text><rect x="20" y="84" width="360" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="200.0" y="109.0" font-size="13" text-anchor="middle" fill="#18181b">Has it received any votes?</text><rect x="470" y="84" width="200" height="44" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="570.0" y="109.0" font-size="13" text-anchor="middle" fill="#18181b">No call</text><path d="M380 106 L470 106" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arw)"/><text x="425" y="99" font-size="12" text-anchor="middle" fill="#52525b">no</text><path d="M200 128 L200 148" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="212" y="142" font-size="12" text-anchor="start" fill="#52525b">yes</text><rect x="20" y="148" width="360" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="200.0" y="173.0" font-size="13" text-anchor="middle" fill="#18181b">Has the election ended?</text><rect x="470" y="148" width="200" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="570.0" y="173.0" font-size="13" text-anchor="middle" fill="#18181b">Called for the leader</text><path d="M380 170 L470 170" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="425" y="163" font-size="12" text-anchor="middle" fill="#52525b">yes</text><path d="M200 192 L200 212" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="212" y="206" font-size="12" text-anchor="start" fill="#52525b">no</text><rect x="20" y="212" width="360" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="200.0" y="235.0" font-size="13" text-anchor="middle" fill="#18181b">Revealed in the final hour and leader ahead by 5</text><text x="200.0" y="251.0" font-size="13" text-anchor="middle" fill="#18181b">points or more?</text><rect x="470" y="212" width="200" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="570.0" y="243.0" font-size="13" text-anchor="middle" fill="#18181b">Called for the leader</text><path d="M380 240 L470 240" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="425" y="233" font-size="12" text-anchor="middle" fill="#52525b">yes</text><path d="M200 268 L200 288" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="212" y="282" font-size="12" text-anchor="start" fill="#52525b">no</text><rect x="20" y="288" width="360" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="200.0" y="311.0" font-size="13" text-anchor="middle" fill="#18181b">Shows as a lead only, not called</text></svg>