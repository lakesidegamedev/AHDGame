<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" font-family="system-ui, sans-serif"><title>Life of an extraction contract</title><desc>A tender is published and bids are sealed; after bidding closes the official picks a winner, the signing fee settles, the contract runs with royalties each turn, and capacity returns to the open pool when it ends. Tenders can be cancelled or expire before an award.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="759" height="399" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="30" width="220" height="66" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="130.0" y="50.0" font-size="13" text-anchor="middle" fill="#18181b">Tender published; its share</text><text x="130.0" y="66.0" font-size="13" text-anchor="middle" fill="#18181b">is reserved under the 75%</text><text x="130.0" y="82.0" font-size="13" text-anchor="middle" fill="#18181b">cap</text><rect x="270" y="30" width="220" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="380.0" y="58.0" font-size="13" text-anchor="middle" fill="#18181b">Sealed bids, signing fee at</text><text x="380.0" y="74.0" font-size="13" text-anchor="middle" fill="#18181b">or above the minimum</text><rect x="520" y="30" width="220" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="630.0" y="58.0" font-size="13" text-anchor="middle" fill="#18181b">Bidding closed; bids become</text><text x="630.0" y="74.0" font-size="13" text-anchor="middle" fill="#18181b">public</text><rect x="520" y="150" width="220" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="630.0" y="178.0" font-size="13" text-anchor="middle" fill="#18181b">Official picks a winner and</text><text x="630.0" y="194.0" font-size="13" text-anchor="middle" fill="#18181b">gives a public reason</text><rect x="270" y="150" width="220" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="380.0" y="186.0" font-size="13" text-anchor="middle" fill="#18181b">Signing fee settles</text><rect x="20" y="150" width="220" height="66" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="130.0" y="178.0" font-size="13" text-anchor="middle" fill="#18181b">Active: royalty charged each</text><text x="130.0" y="194.0" font-size="13" text-anchor="middle" fill="#18181b">turn</text><rect x="20" y="290" width="220" height="66" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="130.0" y="318.0" font-size="13" text-anchor="middle" fill="#18181b">Capacity returns to the open</text><text x="130.0" y="334.0" font-size="13" text-anchor="middle" fill="#18181b">pool</text><rect x="520" y="290" width="220" height="66" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="630.0" y="318.0" font-size="13" text-anchor="middle" fill="#18181b">Canceled; reserved share</text><text x="630.0" y="334.0" font-size="13" text-anchor="middle" fill="#18181b">released</text><path d="M240 63 L270 63" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M490 63 L520 63" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M630 96 L630 150" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M520 183 L490 183" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M270 183 L240 183" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M130 216 L130 290" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="138" y="258" font-size="12" text-anchor="start" fill="#52525b">expiry, 3 missed royalties in a row, or revocation</text><path d="M630 216 L630 290" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arw)"/><text x="620" y="246" font-size="12" text-anchor="end" fill="#52525b">before an award: cancelled,</text><text x="620" y="262" font-size="12" text-anchor="end" fill="#52525b">or the award deadline passes</text></svg>