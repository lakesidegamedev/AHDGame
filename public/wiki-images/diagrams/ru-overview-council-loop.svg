<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" font-family="system-ui, sans-serif">
<title>Soviet Council of Ministers loop</title>
<desc>The Premier appoints 16 ministers; tier settings and 24-turn orders move national metrics, which feed plan results and the marketization dial that decides the economic engine.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="429" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="30" width="130" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="85.0" y="55.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Premier</text>
<rect x="190" y="30" width="250" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="315.0" y="47.0" font-size="12" text-anchor="middle" fill="#18181b">Appoints 16 ministers from Supreme</text>
<text x="315.0" y="63.0" font-size="12" text-anchor="middle" fill="#18181b">Soviet deputies</text>
<path d="M150 52 L190 52" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="20" y="130" width="210" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="125.0" y="149.0" font-size="12" text-anchor="middle" fill="#18181b">Tier setting: three options,</text>
<text x="125.0" y="165.0" font-size="12" text-anchor="middle" fill="#18181b">the middle one is the neutral</text>
<text x="125.0" y="181.0" font-size="12" text-anchor="middle" fill="#18181b">default</text>
<rect x="260" y="130" width="210" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="365.0" y="149.0" font-size="12" text-anchor="middle" fill="#18181b">Two ministerial orders: one</text>
<text x="365.0" y="165.0" font-size="12" text-anchor="middle" fill="#18181b">action each, run 24 turns,</text>
<text x="365.0" y="181.0" font-size="12" text-anchor="middle" fill="#18181b">then expire</text>
<path d="M315 74 L315 102 L125 102 L125 130" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M315 102 L365 102 L365 130" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="130" y="240" width="250" height="50" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="255.0" y="268.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">National metrics move</text>
<path d="M125 194 L125 217 L255 217 L255 240" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M365 194 L365 217 L255 217 L255 240" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="560" y="130" width="220" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="670.0" y="149.0" font-size="12" text-anchor="middle" fill="#18181b">Pressures: black market, plan</text>
<text x="670.0" y="165.0" font-size="12" text-anchor="middle" fill="#18181b">under-fulfilment, reformist</text>
<text x="670.0" y="181.0" font-size="12" text-anchor="middle" fill="#18181b">policy stance</text>
<rect x="560" y="240" width="220" height="50" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="670.0" y="268.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Marketization dial</text>
<path d="M670 194 L670 240" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M380 265 L560 265" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="470" y="257" font-size="12" text-anchor="middle" fill="#52525b">shapes plan results</text>
<rect x="560" y="340" width="220" height="60" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="670.0" y="365.0" font-size="12" text-anchor="middle" fill="#18181b">Decides the engine: command,</text>
<text x="670.0" y="381.0" font-size="12" text-anchor="middle" fill="#18181b">dual-track or market</text>
<path d="M670 290 L670 340" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
</svg>
