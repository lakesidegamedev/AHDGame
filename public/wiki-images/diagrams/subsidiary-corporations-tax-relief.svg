<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" font-family="system-ui, sans-serif">
<title>Tax relief within a group</title>
<desc>A profitable member is taxed; a loss-making member in the same country shelters part of its profit and a rebate is paid back, capped at tax paid; a loss in another country shelters nothing.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="379" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="30" y="40" width="220" height="70" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="140.0" y="71.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Profit member</text>
<text x="140.0" y="88.0" text-anchor="middle" font-size="13" fill="#18181b">taxed on its own profit</text>
<rect x="30" y="150" width="220" height="70" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="140.0" y="181.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Loss member, same country</text>
<text x="140.0" y="198.0" text-anchor="middle" font-size="13" fill="#18181b">loses money</text>
<rect x="30" y="270" width="220" height="70" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.25"/>
<text x="140.0" y="292.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Loss member, another</text>
<text x="140.0" y="309.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">country</text>
<text x="140.0" y="326.5" text-anchor="middle" font-size="13" fill="#18181b">loses money</text>
<path d="M250,75 L320,110" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M250,185 L320,140" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="320" y="85" width="200" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
<text x="420.0" y="112.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Group relief</text>
<text x="420.0" y="129.5" text-anchor="middle" font-size="13" fill="#18181b">the loss shelters part of</text>
<text x="420.0" y="146.5" text-anchor="middle" font-size="13" fill="#18181b">the profit</text>
<path d="M520,125 L570,125" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="570" y="70" width="170" height="110" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
<text x="655.0" y="87.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Rebate</text>
<text x="655.0" y="104.0" text-anchor="middle" font-size="13" fill="#18181b">paid back to the</text>
<text x="655.0" y="121.0" text-anchor="middle" font-size="13" fill="#18181b">members that paid</text>
<text x="655.0" y="138.0" text-anchor="middle" font-size="13" fill="#18181b">tax, in proportion to</text>
<text x="655.0" y="155.0" text-anchor="middle" font-size="13" fill="#18181b">what they paid; never</text>
<text x="655.0" y="172.0" text-anchor="middle" font-size="13" fill="#18181b">more than tax paid</text>
<path d="M250,305 L320,305" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mw)"/>
<rect x="320" y="275" width="200" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.25"/>
<text x="420.0" y="301.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Shelters nothing</text>
<text x="420.0" y="318.0" text-anchor="middle" font-size="13" fill="#18181b">no rebate</text>
</svg>
