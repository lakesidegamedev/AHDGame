<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" role="img" font-family="system-ui, sans-serif"><title>Life of a supply agreement</title><desc>An offer is accepted, possibly after counter-offers, then the agreement settles each turn; either side can serve cancel notice and it still settles until the notice ends or a fixed term ends.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="779" height="329" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="110" width="130" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="85.0" y="141.0" font-size="13" text-anchor="middle" fill="#18181b">Offer</text><rect x="210" y="20" width="170" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="295.0" y="43.0" font-size="13" text-anchor="middle" fill="#18181b">Counter-offers until</text><text x="295.0" y="59.0" font-size="13" text-anchor="middle" fill="#18181b">both agree</text><rect x="300" y="110" width="170" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="385.0" y="133.0" font-size="13" text-anchor="middle" fill="#18181b">Active: settles every</text><text x="385.0" y="149.0" font-size="13" text-anchor="middle" fill="#18181b">turn</text><rect x="570" y="110" width="190" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="665.0" y="130.0" font-size="13" text-anchor="middle" fill="#18181b">Cancel notice: still</text><text x="665.0" y="146.0" font-size="13" text-anchor="middle" fill="#18181b">delivers and settles,</text><text x="665.0" y="162.0" font-size="13" text-anchor="middle" fill="#18181b">damages included</text><rect x="570" y="240" width="190" height="56" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="665.0" y="271.0" font-size="13" text-anchor="middle" fill="#18181b">Cancelled or expired</text><path d="M85 110 L85 48 L210 48" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="135" y="42" font-size="12" text-anchor="middle" fill="#52525b">counter</text><path d="M380 48 L385 48 L385 110" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="393" y="92" font-size="12" text-anchor="start" fill="#52525b">agreed</text><path d="M150 138 L300 138" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="225" y="130" font-size="12" text-anchor="middle" fill="#52525b">accepted</text><path d="M470 143 L570 143" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="520" y="134" font-size="12" text-anchor="middle" fill="#52525b">notice served</text><path d="M665 176 L665 240" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="673" y="212" font-size="12" text-anchor="start" fill="#52525b">notice ends</text><path d="M385 166 L385 268 L570 268" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arw)"/><text x="470" y="260" font-size="12" text-anchor="middle" fill="#52525b">fixed term ends</text></svg>