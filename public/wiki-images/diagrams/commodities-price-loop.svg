<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" font-family="system-ui, sans-serif">
<title>Commodity price loop</title>
<desc>Produced sector supply and demand feed global, national and state pools, which are blended 50/25/25 into a target price; the price drifts 6% a turn, sets margins and revenue realization, and revenue feeds back into supply and demand.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="469" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="150" width="170" height="100" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="105.0" y="179.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Sector supply and</text>
<text x="105.0" y="196.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">demand</text>
<text x="105.0" y="213.0" text-anchor="middle" font-size="13" fill="#18181b">only produced units</text>
<text x="105.0" y="230.0" text-anchor="middle" font-size="13" fill="#18181b">count</text>
<rect x="230" y="40" width="180" height="80" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="320.0" y="67.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Global pool</text>
<text x="320.0" y="84.5" text-anchor="middle" font-size="13" fill="#18181b">plus a stabilizer on</text>
<text x="320.0" y="101.5" text-anchor="middle" font-size="13" fill="#18181b">both sides</text>
<path d="M190,200 L230,80" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M410,80 L450,200" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="230" y="150" width="180" height="80" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="320.0" y="177.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">National pool</text>
<text x="320.0" y="194.5" text-anchor="middle" font-size="13" fill="#18181b">plus a small</text>
<text x="320.0" y="211.5" text-anchor="middle" font-size="13" fill="#18181b">stabilizer</text>
<path d="M190,200 L230,190" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M410,190 L450,200" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="230" y="260" width="180" height="80" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="320.0" y="287.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">State pool</text>
<text x="320.0" y="304.5" text-anchor="middle" font-size="13" fill="#18181b">the state's own supply</text>
<text x="320.0" y="321.5" text-anchor="middle" font-size="13" fill="#18181b">and demand</text>
<path d="M190,200 L230,300" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M410,300 L450,200" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="450" y="142" width="150" height="116" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
<text x="525.0" y="162.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Blend</text>
<text x="525.0" y="179.0" text-anchor="middle" font-size="13" fill="#18181b">50% global, 25%</text>
<text x="525.0" y="196.0" text-anchor="middle" font-size="13" fill="#18181b">national, 25%</text>
<text x="525.0" y="213.0" text-anchor="middle" font-size="13" fill="#18181b">state (50/50 for</text>
<text x="525.0" y="230.0" text-anchor="middle" font-size="13" fill="#18181b">four macro</text>
<text x="525.0" y="247.0" text-anchor="middle" font-size="13" fill="#18181b">commodities)</text>
<path d="M600,200 L640,200" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="640" y="150" width="140" height="100" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
<text x="710.0" y="179.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Price</text>
<text x="710.0" y="196.0" text-anchor="middle" font-size="13" fill="#18181b">closes 6% of the</text>
<text x="710.0" y="213.0" text-anchor="middle" font-size="13" fill="#18181b">gap to the</text>
<text x="710.0" y="230.0" text-anchor="middle" font-size="13" fill="#18181b">target each turn</text>
<path d="M700,250 L700,310" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M700,250 L700,280 L520,280 L520,310" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="450" y="310" width="140" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="520.0" y="329.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Margins</text>
<text x="520.0" y="346.5" text-anchor="middle" font-size="13" fill="#18181b">computed at</text>
<text x="520.0" y="363.5" text-anchor="middle" font-size="13" fill="#18181b">three tiers</text>
<rect x="630" y="310" width="150" height="72" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="705.0" y="325.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Revenue</text>
<text x="705.0" y="342.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">realization</text>
<text x="705.0" y="359.0" text-anchor="middle" font-size="13" fill="#18181b">uses last turn's</text>
<text x="705.0" y="376.0" text-anchor="middle" font-size="13" fill="#18181b">price</text>
<path d="M705,382 L705,430 L105,430 L105,250" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<text x="400" y="424" text-anchor="middle" font-size="12" fill="#52525b" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">revenue changes sector output and demand</text>
</svg>
