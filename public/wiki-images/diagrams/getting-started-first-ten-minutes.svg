<svg xmlns="http://www.w3.org/2000/svg" width="760" height="348" viewBox="0 0 760 348" role="img" font-family="system-ui, sans-serif">
<title>First ten minutes flow</title>
<desc>Read the dashboard, campaign three times, join a party, build a donor network and fundraise, then find an open race, run a Quick Poll, declare in the primary window and open View Campaign. If no race is open or the window has closed, keep building and enter the next one.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="347" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="20" width="155" height="64" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="97.5" y="40.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">1 Read the</text>
<text x="97.5" y="56.5" font-size="13" text-anchor="middle" fill="#18181b">dashboard</text>
<text x="97.5" y="72.5" font-size="12" text-anchor="middle" fill="#3f3f46">Actions, funds, PI</text>
<path d="M177 52 L203 52" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="205" y="20" width="155" height="64" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="282.5" y="40.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">2 Campaign</text>
<text x="282.5" y="56.5" font-size="13" text-anchor="middle" fill="#18181b">at home 3 times</text>
<text x="282.5" y="72.5" font-size="12" text-anchor="middle" fill="#3f3f46">raises PI</text>
<path d="M362 52 L388 52" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="390" y="20" width="155" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="467.5" y="40.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">3 Join a party</text>
<text x="467.5" y="56.5" font-size="12" text-anchor="middle" fill="#3f3f46">primary, pool,</text>
<text x="467.5" y="72.5" font-size="12" text-anchor="middle" fill="#3f3f46">leadership ladder</text>
<path d="M547 52 L573 52" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="575" y="20" width="155" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="652.5" y="40.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">4 Donors and funds</text>
<text x="652.5" y="56.5" font-size="12" text-anchor="middle" fill="#3f3f46">Build Donor Network,</text>
<text x="652.5" y="72.5" font-size="12" text-anchor="middle" fill="#3f3f46">Fundraise once</text>
<path d="M652 86 L652 112 L97 112 L97 138" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="20" y="140" width="155" height="64" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="97.5" y="160.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">5 Find a race</text>
<text x="97.5" y="176.6" font-size="12" text-anchor="middle" fill="#3f3f46">Elections, filter to</text>
<text x="97.5" y="192.6" font-size="12" text-anchor="middle" fill="#3f3f46">your home state</text>
<path d="M177 172 L203 172" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="205" y="140" width="155" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="282.5" y="160.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">6 Quick Poll</text>
<text x="282.5" y="176.6" font-size="12" text-anchor="middle" fill="#3f3f46">2 actions; check</text>
<text x="282.5" y="192.6" font-size="12" text-anchor="middle" fill="#3f3f46">your standing</text>
<path d="M362 172 L388 172" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="390" y="140" width="155" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="467.5" y="160.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">7 Declare</text>
<text x="467.5" y="176.6" font-size="12" text-anchor="middle" fill="#3f3f46">during the primary</text>
<text x="467.5" y="192.6" font-size="12" text-anchor="middle" fill="#3f3f46">window</text>
<path d="M547 172 L573 172" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="575" y="140" width="155" height="64" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="652.5" y="160.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">8 View Campaign</text>
<text x="652.5" y="176.6" font-size="12" text-anchor="middle" fill="#3f3f46">spend funds, run</text>
<text x="652.5" y="192.6" font-size="12" text-anchor="middle" fill="#3f3f46">ads, canvass</text>
<path d="M97 206 L97 244" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="107" y="232" font-size="12" text-anchor="start" fill="#52525b">none open</text>
<rect x="20" y="246" width="330" height="76" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="185.0" y="272.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">No race open, or its window has closed</text>
<text x="185.0" y="288.6" font-size="12" text-anchor="middle" fill="#3f3f46">keep building PI, donors and party standing;</text>
<text x="185.0" y="304.6" font-size="12" text-anchor="middle" fill="#3f3f46">enter the next race when it opens</text>
<path d="M467 206 L467 244" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="477" y="232" font-size="12" text-anchor="start" fill="#52525b">missed</text>
<rect x="390" y="246" width="200" height="76" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="490.0" y="280.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Primary window missed</text>
<text x="490.0" y="296.6" font-size="12" text-anchor="middle" fill="#3f3f46">waits a full cycle</text>
</svg>
