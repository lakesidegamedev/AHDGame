<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" font-family="system-ui, sans-serif"><title>What sets cold war tension</title><desc>Tension is set by one-off spikes and a standing floor, and the resulting 0 to 100 reading drives three dials and domestic world events.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="759" height="329" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="50" width="160" height="90" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="100.0" y="82.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">One-off events</text><text x="100.0" y="98.0" font-size="13" text-anchor="middle" fill="#18181b">nuclear tests,</text><text x="100.0" y="114.0" font-size="13" text-anchor="middle" fill="#18181b">escalations, crises</text><rect x="20" y="190" width="160" height="100" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="100.0" y="219.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">Standing pressure</text><text x="100.0" y="235.0" font-size="13" text-anchor="middle" fill="#18181b">arsenals, crises,</text><text x="100.0" y="251.0" font-size="13" text-anchor="middle" fill="#18181b">escalation,</text><text x="100.0" y="267.0" font-size="13" text-anchor="middle" fill="#18181b">shooting wars</text><rect x="250" y="50" width="140" height="90" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="320.0" y="82.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">Spikes</text><text x="320.0" y="98.0" font-size="13" text-anchor="middle" fill="#18181b">fade back toward</text><text x="320.0" y="114.0" font-size="13" text-anchor="middle" fill="#18181b">the floor</text><rect x="250" y="190" width="140" height="100" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="320.0" y="227.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">Floor</text><text x="320.0" y="243.0" font-size="13" text-anchor="middle" fill="#18181b">tension never</text><text x="320.0" y="259.0" font-size="13" text-anchor="middle" fill="#18181b">falls below it</text><rect x="450" y="125" width="110" height="90" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="505.0" y="165.0" font-size="14" text-anchor="middle" fill="#18181b" font-weight="bold">Tension</text><text x="505.0" y="182.0" font-size="14" text-anchor="middle" fill="#18181b">0 to 100</text><rect x="620" y="40" width="120" height="130" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="680.0" y="60.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">Three dials</text><text x="680.0" y="76.0" font-size="13" text-anchor="middle" fill="#18181b">readiness</text><text x="680.0" y="92.0" font-size="13" text-anchor="middle" fill="#18181b">level, arms</text><text x="680.0" y="108.0" font-size="13" text-anchor="middle" fill="#18181b">demand,</text><text x="680.0" y="124.0" font-size="13" text-anchor="middle" fill="#18181b">detente</text><text x="680.0" y="140.0" font-size="13" text-anchor="middle" fill="#18181b">goodwill</text><text x="680.0" y="156.0" font-size="13" text-anchor="middle" fill="#18181b">penalty</text><rect x="620" y="200" width="120" height="90" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="680.0" y="224.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">Domestic world</text><text x="680.0" y="240.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">events</text><text x="680.0" y="256.0" font-size="13" text-anchor="middle" fill="#18181b">at high</text><text x="680.0" y="272.0" font-size="13" text-anchor="middle" fill="#18181b">tension</text><path d="M180 95 L250 95" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="215" y="87" font-size="12" text-anchor="middle" fill="#52525b">push up</text><path d="M180 240 L250 240" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="215" y="232" font-size="12" text-anchor="middle" fill="#52525b">set the floor</text><path d="M390 95 L420 95 L420 155 L450 155" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M390 240 L420 240 L420 185 L450 185" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M560 155 L590 155 L590 105 L620 105" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="590" y="148" font-size="12" text-anchor="middle" fill="#52525b">sets</text><path d="M560 185 L590 185 L590 245 L620 245" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="590" y="212" font-size="12" text-anchor="middle" fill="#52525b">triggers</text></svg>