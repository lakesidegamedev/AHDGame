<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" font-family="system-ui, sans-serif">
<title>World event scheduler, each turn</title>
<desc>Each turn every active country is checked: skip if an offer is pending, otherwise pick the first due event, offer at most one to the head of government, and report the outcome in news.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="439" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="20" width="330" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="185.0" y="43.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Each turn, each active country</text>
<rect x="20" y="90" width="330" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="185.0" y="113.5" font-size="13" text-anchor="middle" fill="#18181b">Pending world event already?</text>
<path d="M185 60 L185 90" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="430" y="90" width="200" height="40" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="530.0" y="113.5" font-size="13" text-anchor="middle" fill="#18181b">Skip this country</text>
<path d="M350 110 L430 110" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="390" y="104" font-size="12" text-anchor="middle" fill="#52525b">yes</text>
<rect x="20" y="170" width="330" height="70" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="185.0" y="191.5" font-size="13" text-anchor="middle" fill="#18181b">Find the first scheduled event that is due,</text>
<text x="185.0" y="208.5" font-size="13" text-anchor="middle" fill="#18181b">allowed for the country, inside its year</text>
<text x="185.0" y="225.5" font-size="13" text-anchor="middle" fill="#18181b">window and inside its tension window</text>
<path d="M185 130 L185 170" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="193" y="154" font-size="12" text-anchor="start" fill="#52525b">no</text>
<rect x="430" y="164" width="350" height="82" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="605.0" y="192.0" font-size="12" text-anchor="middle" fill="#18181b">Host events are scheduled in the same pass</text>
<text x="605.0" y="208.0" font-size="12" text-anchor="middle" fill="#18181b">Olympics: every 48 turns from turn 12</text>
<text x="605.0" y="224.0" font-size="12" text-anchor="middle" fill="#18181b">World's Fair: every 36 turns from turn 30</text>
<path d="M430 205 L350 205" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="20" y="280" width="330" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="185.0" y="297.0" font-size="13" text-anchor="middle" fill="#18181b">Offer one event, at most, to the head of</text>
<text x="185.0" y="314.0" font-size="13" text-anchor="middle" fill="#18181b">government</text>
<path d="M185 240 L185 280" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="20" y="364" width="330" height="52" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="185.0" y="385.0" font-size="13" text-anchor="middle" fill="#18181b">Leader answers, or the neutral default</text>
<text x="185.0" y="402.0" font-size="13" text-anchor="middle" fill="#18181b">resolves after 24 real hours</text>
<path d="M185 324 L185 364" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="430" y="364" width="350" height="52" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="605.0" y="385.0" font-size="13" text-anchor="middle" fill="#18181b">Outcome shows in News and in the country</text>
<text x="605.0" y="402.0" font-size="13" text-anchor="middle" fill="#18181b">numbers</text>
<path d="M350 390 L430 390" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
</svg>
