<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" font-family="system-ui, sans-serif">
<title>NPP autonomy ladder</title>
<desc>Autonomy levels from off to v6, each adding to the level below. In countries players play, autonomy acts only from v2 upward.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="439" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<text x="18" y="28" font-size="15" fill="#18181b" text-anchor="start" font-weight="700">What each autonomy level adds</text>
<rect x="20" y="44" width="60" height="38" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="50.0" y="66.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">v6</text>
<rect x="88" y="44" width="470" height="38" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="323.0" y="66.5" font-size="13" fill="#18181b" text-anchor="middle">Same activities, better decisions, lower running cost</text>
<rect x="20" y="90" width="60" height="38" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="50.0" y="112.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">v5</text>
<rect x="88" y="90" width="470" height="38" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="323.0" y="112.5" font-size="13" fill="#18181b" text-anchor="middle">Standing government goals; NPPs age, retire, are replaced</text>
<rect x="20" y="136" width="60" height="38" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="50.0" y="158.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">v4</text>
<rect x="88" y="136" width="470" height="38" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="323.0" y="158.5" font-size="13" fill="#18181b" text-anchor="middle">Global economic actions, deeper bill sponsorship</text>
<rect x="20" y="182" width="60" height="38" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="50.0" y="204.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">v3</text>
<rect x="88" y="182" width="470" height="38" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="323.0" y="204.5" font-size="13" fill="#18181b" text-anchor="middle">Savings, unions, campaign finance; presidential challenges</text>
<rect x="20" y="228" width="60" height="38" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="50.0" y="250.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">v2</text>
<rect x="88" y="228" width="470" height="38" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="323.0" y="250.5" font-size="13" fill="#18181b" text-anchor="middle">Caretaker ministers and CEOs, corporate attacks</text>
<rect x="20" y="274" width="60" height="38" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="50.0" y="296.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">v1</text>
<rect x="88" y="274" width="470" height="38" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="323.0" y="296.5" font-size="13" fill="#18181b" text-anchor="middle">Bill sponsorship, cabinets, governing agendas</text>
<rect x="20" y="320" width="60" height="38" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="50.0" y="342.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">v0</text>
<rect x="88" y="320" width="470" height="38" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="323.0" y="342.5" font-size="13" fill="#18181b" text-anchor="middle">Party organization votes; fills stalled top jobs</text>
<rect x="20" y="366" width="60" height="38" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="50.0" y="388.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">off</text>
<rect x="88" y="366" width="470" height="38" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="323.0" y="388.5" font-size="13" fill="#18181b" text-anchor="middle">Reactive voting and elections only</text>
<path d="M572 44 L584 44 L584 266 L572 266" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="594" y="146" font-size="13" fill="#18181b" text-anchor="start" font-weight="700">Player countries:</text>
<text x="594" y="164" font-size="13" fill="#18181b" text-anchor="start">autonomy acts only</text>
<text x="594" y="182" font-size="13" fill="#18181b" text-anchor="start">from v2 upward</text>
<path d="M572 274 L584 274 L584 404 L572 404" fill="none" stroke="#a1a1aa" stroke-width="2"/>
<text x="594" y="326" font-size="13" fill="#18181b" text-anchor="start" font-weight="700">In player countries</text>
<text x="594" y="344" font-size="13" fill="#18181b" text-anchor="start">these count as off</text>
<text x="594" y="372" font-size="13" fill="#52525b" text-anchor="start">Countries nobody plays</text>
<text x="594" y="390" font-size="13" fill="#52525b" text-anchor="start">use the level as set</text>
</svg>
