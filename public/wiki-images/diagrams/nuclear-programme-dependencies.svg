<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" font-family="system-ui, sans-serif">
<title>Nuclear programme dependency graph</title>
<desc>Device tiers Fission, Boosted Fission, Thermonuclear and MIRV each require the one before, MIRV also needs an ICBM force. Delivery legs Bombers, IRBM, ICBM and SLBM are a chain starting from a fission device. All of it sits behind the Nuclear Delivery doctrine node.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="359" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<text x="18" y="28" font-size="15" fill="#18181b" text-anchor="start" font-weight="700">Device tiers and delivery legs</text>
<rect x="20" y="40" width="176" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="108.0" y="63.0" font-size="12" fill="#18181b" text-anchor="middle">Nuclear Delivery doctrine</text>
<path d="M108 80 L108 108" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="113" y="87" width="94.2" height="15" fill="#ffffff"/>
<text x="116" y="98" font-size="12" fill="#52525b" text-anchor="start">required first</text>
<rect x="20" y="108" width="176" height="96" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="108.0" y="134.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Fission</text>
<text x="108.0" y="151.0" font-size="13" fill="#18181b" text-anchor="middle">Test 12,000</text>
<text x="108.0" y="168.0" font-size="13" fill="#18181b" text-anchor="middle">Cap 2 a turn</text>
<text x="108.0" y="185.0" font-size="13" fill="#18181b" text-anchor="middle">Tension +9</text>
<rect x="212" y="108" width="176" height="96" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="300.0" y="134.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Boosted Fission</text>
<text x="300.0" y="151.0" font-size="13" fill="#18181b" text-anchor="middle">Test 9,000</text>
<text x="300.0" y="168.0" font-size="13" fill="#18181b" text-anchor="middle">Cap 4 a turn</text>
<text x="300.0" y="185.0" font-size="13" fill="#18181b" text-anchor="middle">Tension +6</text>
<rect x="404" y="108" width="176" height="96" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="492.0" y="134.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Thermonuclear</text>
<text x="492.0" y="151.0" font-size="13" fill="#18181b" text-anchor="middle">Test 18,000</text>
<text x="492.0" y="168.0" font-size="13" fill="#18181b" text-anchor="middle">Cap 6 a turn</text>
<text x="492.0" y="185.0" font-size="13" fill="#18181b" text-anchor="middle">Tension +12</text>
<rect x="596" y="108" width="176" height="96" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="684.0" y="134.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">MIRV</text>
<text x="684.0" y="151.0" font-size="13" fill="#18181b" text-anchor="middle">Test 22,000</text>
<text x="684.0" y="168.0" font-size="13" fill="#18181b" text-anchor="middle">Cap 8 a turn</text>
<text x="684.0" y="185.0" font-size="13" fill="#18181b" text-anchor="middle">Tension +10</text>
<path d="M196 156 L212 156" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M388 156 L404 156" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M580 156 L596 156" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="20" y="268" width="176" height="60" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="108.0" y="293.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Strategic Bombers</text>
<text x="108.0" y="310.0" font-size="13" fill="#18181b" text-anchor="middle">Cost 6,000</text>
<rect x="212" y="268" width="176" height="60" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="300.0" y="293.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">IRBM Force</text>
<text x="300.0" y="310.0" font-size="13" fill="#18181b" text-anchor="middle">Cost 8,000</text>
<rect x="404" y="268" width="176" height="60" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="492.0" y="293.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">ICBM Force</text>
<text x="492.0" y="310.0" font-size="13" fill="#18181b" text-anchor="middle">Cost 14,000</text>
<rect x="596" y="268" width="176" height="60" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="684.0" y="293.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">SLBM Deterrent</text>
<text x="684.0" y="310.0" font-size="13" fill="#18181b" text-anchor="middle">Cost 16,000</text>
<path d="M196 298 L212 298" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#mn)"/>
<path d="M388 298 L404 298" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#mn)"/>
<path d="M580 298 L596 298" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#mn)"/>
<path d="M108 204 L108 268" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#mn)"/>
<rect x="113" y="229" width="163.5" height="15" fill="#ffffff"/>
<text x="116" y="240" font-size="12" fill="#52525b" text-anchor="start">requires a fission device</text>
<path d="M500 268 L500 236 L684 236 L684 204" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="524.0" y="219" width="132.0" height="15" fill="#ffffff"/>
<text x="590" y="230" font-size="12" fill="#52525b" text-anchor="middle">MIRV also needs ICBM</text>
<text x="224" y="64" font-size="12" fill="#52525b" text-anchor="start">Devices are adopted by public test. Delivery legs are adopted quietly.</text>
</svg>
