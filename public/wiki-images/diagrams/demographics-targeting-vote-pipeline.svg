<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" font-family="system-ui, sans-serif"><title>How a cell's votes are shared</title><desc>A cell's pool is its size times its turnout; each candidate's weight multiplies reach, appeal, approval, party organization and infamy, and the pool is split in proportion to those weights.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="759" height="299" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="20" width="270" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="155.0" y="35.0" font-size="13" text-anchor="middle" fill="#18181b">Reach: square root of political</text><text x="155.0" y="51.0" font-size="13" text-anchor="middle" fill="#18181b">influence</text><path d="M290 40 L320 40 L320 140 L350 140" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="20" y="72" width="270" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="155.0" y="87.0" font-size="13" text-anchor="middle" fill="#18181b">Appeal: how close your positions</text><text x="155.0" y="103.0" font-size="13" text-anchor="middle" fill="#18181b">are to the cell's</text><path d="M290 92 L320 92 L320 140 L350 140" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="20" y="124" width="270" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="155.0" y="139.0" font-size="13" text-anchor="middle" fill="#18181b">Approval: your favorability with</text><text x="155.0" y="155.0" font-size="13" text-anchor="middle" fill="#18181b">the cell</text><path d="M290 144 L320 144 L320 140 L350 140" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="20" y="176" width="270" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="155.0" y="191.0" font-size="13" text-anchor="middle" fill="#18181b">Party organization: your party's</text><text x="155.0" y="207.0" font-size="13" text-anchor="middle" fill="#18181b">share in the state</text><path d="M290 196 L320 196 L320 140 L350 140" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="20" y="228" width="270" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="155.0" y="251.0" font-size="13" text-anchor="middle" fill="#18181b">Infamy: a small penalty</text><path d="M290 248 L320 248 L320 140 L350 140" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="350" y="100" width="150" height="80" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="425.0" y="119.0" font-size="13" text-anchor="middle" fill="#18181b">Candidate weight:</text><text x="425.0" y="135.0" font-size="13" text-anchor="middle" fill="#18181b">all five</text><text x="425.0" y="151.0" font-size="13" text-anchor="middle" fill="#18181b">multiplied</text><text x="425.0" y="167.0" font-size="13" text-anchor="middle" fill="#18181b">together</text><rect x="560" y="150" width="180" height="90" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="650.0" y="174.0" font-size="13" text-anchor="middle" fill="#18181b">Candidate's share of</text><text x="650.0" y="190.0" font-size="13" text-anchor="middle" fill="#18181b">the cell: their weight</text><text x="650.0" y="206.0" font-size="13" text-anchor="middle" fill="#18181b">over every candidate's</text><text x="650.0" y="222.0" font-size="13" text-anchor="middle" fill="#18181b">weight, times the pool</text><rect x="560" y="20" width="180" height="70" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="650.0" y="50.0" font-size="13" text-anchor="middle" fill="#18181b">Cell pool: the cell's</text><text x="650.0" y="66.0" font-size="13" text-anchor="middle" fill="#18181b">size times its turnout</text><path d="M500 140 L530 140 L530 195 L560 195" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M650 90 L650 150" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/></svg>