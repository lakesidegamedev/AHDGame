<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" font-family="system-ui, sans-serif"><title>What a tariff changes</title><desc>An enacted tariff becomes an effective rate, which fans out into six effects: foreign margin penalty, domestic malus, commodity blend tilt, market capture multipliers, inflation pressure and a sentiment pulse for sector-scope tariffs.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="759" height="399" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="165" width="130" height="70" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="85.0" y="195.0" font-size="13" text-anchor="middle" fill="#18181b">Tariff bill</text><text x="85.0" y="211.0" font-size="13" text-anchor="middle" fill="#18181b">enacted</text><rect x="190" y="150" width="200" height="100" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="290.0" y="179.0" font-size="13" text-anchor="middle" fill="#18181b">Effective rate: sum of</text><text x="290.0" y="195.0" font-size="13" text-anchor="middle" fill="#18181b">the layers, capped at</text><text x="290.0" y="211.0" font-size="13" text-anchor="middle" fill="#18181b">100%, and 0 for a free</text><text x="290.0" y="227.0" font-size="13" text-anchor="middle" fill="#18181b">trade partner</text><rect x="470" y="20" width="270" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="605.0" y="45.0" font-size="13" text-anchor="middle" fill="#18181b">Foreign sector margin penalty</text><path d="M390 200 L430 200 L430 42 L470 42" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="470" y="80" width="270" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="605.0" y="105.0" font-size="13" text-anchor="middle" fill="#18181b">Domestic sector malus</text><path d="M390 200 L430 200 L430 102 L470 102" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="470" y="140" width="270" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="605.0" y="157.0" font-size="13" text-anchor="middle" fill="#18181b">Commodity margin blend tilts toward</text><text x="605.0" y="173.0" font-size="13" text-anchor="middle" fill="#18181b">national</text><path d="M390 200 L430 200 L430 162 L470 162" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="470" y="200" width="270" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="605.0" y="225.0" font-size="13" text-anchor="middle" fill="#18181b">Market capture multipliers</text><path d="M390 200 L430 200 L430 222 L470 222" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="470" y="260" width="270" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="605.0" y="277.0" font-size="13" text-anchor="middle" fill="#18181b">Inflation pressure above a 3%</text><text x="605.0" y="293.0" font-size="13" text-anchor="middle" fill="#18181b">baseline</text><path d="M390 200 L430 200 L430 282 L470 282" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="470" y="320" width="270" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="605.0" y="345.0" font-size="13" text-anchor="middle" fill="#18181b">Sentiment pulse (sector scope only)</text><path d="M390 200 L430 200 L430 342 L470 342" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M150 200 L190 200" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/></svg>