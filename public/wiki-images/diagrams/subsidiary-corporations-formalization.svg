<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" font-family="system-ui, sans-serif">
<title>Formalizing a subsidiary</title>
<desc>Checklist to formalize a subsidiary, the parent powers it brings, the limits on the subsidiary, and how formalization ends automatically.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker></defs>
<rect x="0.5" y="0.5" width="779" height="399" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="40" width="235" height="230" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="32" y="91.5" text-anchor="start" font-size="13" font-weight="700" fill="#18181b">To formalize, all of these</text>
<text x="32" y="108.5" text-anchor="start" font-size="13" fill="#18181b">More than 50% voting power</text>
<text x="32" y="125.5" text-anchor="start" font-size="13" fill="#18181b">Target is not a subsidiary or</text>
<text x="32" y="142.5" text-anchor="start" font-size="13" fill="#18181b">state-owned</text>
<text x="32" y="159.5" text-anchor="start" font-size="13" fill="#18181b">Parent is not state-owned or</text>
<text x="32" y="176.5" text-anchor="start" font-size="13" fill="#18181b">itself a subsidiary (no</text>
<text x="32" y="193.5" text-anchor="start" font-size="13" fill="#18181b">chains)</text>
<text x="32" y="210.5" text-anchor="start" font-size="13" fill="#18181b">No ownership cycle</text>
<text x="32" y="227.5" text-anchor="start" font-size="13" fill="#18181b">A different human runs it</text>
<path d="M255,150 L305,150" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="305" y="110" width="160" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
<text x="385.0" y="129.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Formalized</text>
<text x="385.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">subsidiary</text>
<text x="385.0" y="163.0" text-anchor="middle" font-size="13" fill="#18181b">parent controls the</text>
<text x="385.0" y="180.0" text-anchor="middle" font-size="13" fill="#18181b">votes</text>
<path d="M465,150 L515,150" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="515" y="40" width="245" height="150" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
<text x="527" y="77.0" text-anchor="start" font-size="13" font-weight="700" fill="#18181b">Parent powers</text>
<text x="527" y="94.0" text-anchor="start" font-size="13" fill="#18181b">Inject capital</text>
<text x="527" y="111.0" text-anchor="start" font-size="13" fill="#18181b">Set a dividend floor</text>
<text x="527" y="128.0" text-anchor="start" font-size="13" fill="#18181b">Appoint the CEO</text>
<text x="527" y="145.0" text-anchor="start" font-size="13" fill="#18181b">Spin off a piece of the business</text>
<text x="527" y="162.0" text-anchor="start" font-size="13" fill="#18181b">Release after 24 turns</text>
<rect x="515" y="215" width="245" height="80" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.25"/>
<text x="637.5" y="242.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Limits</text>
<text x="637.5" y="259.5" text-anchor="middle" font-size="13" fill="#18181b">The subsidiary cannot issue</text>
<text x="637.5" y="276.5" text-anchor="middle" font-size="13" fill="#18181b">shares</text>
<path d="M385,190 L385,250" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mw)"/>
<text x="393" y="214" text-anchor="start" font-size="12" fill="#52525b" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">control falls to</text>
<text x="393" y="228" text-anchor="start" font-size="12" fill="#52525b" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">50% or below</text>
<rect x="305" y="250" width="160" height="70" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.25"/>
<text x="385.0" y="272.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Cleared</text>
<text x="385.0" y="289.5" text-anchor="middle" font-size="13" fill="#18181b">formalization ends</text>
<text x="385.0" y="306.5" text-anchor="middle" font-size="13" fill="#18181b">on the next turn</text>
<text x="20" y="300" text-anchor="start" font-size="12" fill="#52525b" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">Tax relief and strength lift apply to the group</text>
<text x="20" y="316" text-anchor="start" font-size="12" fill="#52525b" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">while the relationship stands.</text>
</svg>
