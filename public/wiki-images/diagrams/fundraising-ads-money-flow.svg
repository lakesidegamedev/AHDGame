<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" role="img" font-family="system-ui, sans-serif"><title>Where campaign funds come from and go</title><desc>Base rate, donor bonus and office bonus add to Campaign Funds each turn; personal Cash on Hand converts at 50%; funds are spent on ads, polls, canvassing and campaign presence, and a party tax goes to the party.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="779" height="379" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="30" width="180" height="50" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="110.0" y="50.0" font-size="13" text-anchor="middle" fill="#18181b">Base rate, by home</text><text x="110.0" y="66.0" font-size="13" text-anchor="middle" fill="#18181b">state size</text><rect x="20" y="100" width="180" height="50" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="110.0" y="120.0" font-size="13" text-anchor="middle" fill="#18181b">Donor bonus, by donor</text><text x="110.0" y="136.0" font-size="13" text-anchor="middle" fill="#18181b">base level</text><rect x="20" y="170" width="180" height="50" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="110.0" y="190.0" font-size="13" text-anchor="middle" fill="#18181b">Office bonus, while in</text><text x="110.0" y="206.0" font-size="13" text-anchor="middle" fill="#18181b">office</text><rect x="20" y="290" width="180" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="110.0" y="313.0" font-size="13" text-anchor="middle" fill="#18181b">Cash on Hand (personal</text><text x="110.0" y="329.0" font-size="13" text-anchor="middle" fill="#18181b">cash)</text><rect x="300" y="130" width="170" height="90" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="385.0" y="179.0" font-size="15" text-anchor="middle" fill="#18181b" font-weight="bold">Campaign Funds</text><rect x="570" y="20" width="190" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="665.0" y="45.0" font-size="13" text-anchor="middle" fill="#18181b">Ads</text><path d="M470 175 L520 175 L520 42 L570 42" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="570" y="82" width="190" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="665.0" y="107.0" font-size="13" text-anchor="middle" fill="#18181b">Polls</text><path d="M470 175 L520 175 L520 104 L570 104" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="570" y="144" width="190" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="665.0" y="169.0" font-size="13" text-anchor="middle" fill="#18181b">Canvassing</text><path d="M470 175 L520 175 L520 166 L570 166" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="570" y="206" width="190" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="665.0" y="231.0" font-size="13" text-anchor="middle" fill="#18181b">Campaign Presence</text><path d="M470 175 L520 175 L520 228 L570 228" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="570" y="268" width="190" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="665.0" y="285.0" font-size="13" text-anchor="middle" fill="#18181b">Party tax, to the party</text><text x="665.0" y="301.0" font-size="13" text-anchor="middle" fill="#18181b">treasury</text><path d="M470 175 L520 175 L520 290 L570 290" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M200 55 L250 55 L250 175 L300 175" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M200 125 L250 125 L250 175 L300 175" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M200 195 L250 195 L250 175 L300 175" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M200 318 L385 318 L385 220" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="210" y="338" font-size="12" text-anchor="start" fill="#52525b">personal donation, 50% arrives</text><text x="385" y="120" font-size="12" text-anchor="middle" fill="#52525b">each turn</text></svg>