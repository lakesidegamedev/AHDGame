<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" font-family="system-ui, sans-serif"><title>Order in which market demand clears</title><desc>Demand is filled first by supply agreements, then by a loyal slice split by loyalty, then cheapest-first; the loyal slice is earned by steady pricing, delivering and resisting cheaper rivals.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="759" height="369" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="40" width="300" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="170.0" y="63.0" font-size="13" text-anchor="middle" fill="#18181b">1. Contracted: supply agreements fill</text><text x="170.0" y="79.0" font-size="13" text-anchor="middle" fill="#18181b">first</text><rect x="20" y="150" width="300" height="76" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="170.0" y="175.0" font-size="13" text-anchor="middle" fill="#18181b">2. Loyal slice: 40% of demand, split</text><text x="170.0" y="191.0" font-size="13" text-anchor="middle" fill="#18181b">between sellers in proportion to</text><text x="170.0" y="207.0" font-size="13" text-anchor="middle" fill="#18181b">loyalty</text><rect x="20" y="280" width="300" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="170.0" y="303.0" font-size="13" text-anchor="middle" fill="#18181b">3. Cheapest-first: the other 60% clears</text><text x="170.0" y="319.0" font-size="13" text-anchor="middle" fill="#18181b">on price</text><path d="M170 96 L170 150" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M170 226 L170 280" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="420" y="106" font-size="13" text-anchor="start" fill="#18181b" font-weight="bold">Earned, 1 point a turn, when all three hold:</text><rect x="420" y="122" width="320" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="580.0" y="139.0" font-size="13" text-anchor="middle" fill="#18181b">Steady pricing: posture within 4 points of</text><text x="580.0" y="155.0" font-size="13" text-anchor="middle" fill="#18181b">your own norm</text><rect x="420" y="174" width="320" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="580.0" y="191.0" font-size="13" text-anchor="middle" fill="#18181b">Delivering: you sold at least half of what</text><text x="580.0" y="207.0" font-size="13" text-anchor="middle" fill="#18181b">you offered</text><rect x="420" y="226" width="320" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="580.0" y="243.0" font-size="13" text-anchor="middle" fill="#18181b">A rival in the commodity prices 5 points</text><text x="580.0" y="259.0" font-size="13" text-anchor="middle" fill="#18181b">or more below you</text><path d="M420 196 L320 190" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/></svg>