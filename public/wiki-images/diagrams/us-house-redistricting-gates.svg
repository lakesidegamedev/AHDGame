<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" font-family="system-ui, sans-serif"><title>Gates for redrawing a House map</title><desc>A House map can be saved only if it is a census year, the acting character is the governor, their party holds the legislature, state law gives the legislature the pen, and the map meets the compactness, packed-district and efficiency-gap caps.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="799" height="329" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="30" width="160" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="100.0" y="50.0" font-size="13" text-anchor="middle" fill="#18181b">Census year, once</text><text x="100.0" y="66.0" font-size="13" text-anchor="middle" fill="#18181b">per census per</text><text x="100.0" y="82.0" font-size="13" text-anchor="middle" fill="#18181b">state</text><path d="M180 63 L215 63" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="215" y="30" width="160" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="295.0" y="50.0" font-size="13" text-anchor="middle" fill="#18181b">Acting character is</text><text x="295.0" y="66.0" font-size="13" text-anchor="middle" fill="#18181b">the state's</text><text x="295.0" y="82.0" font-size="13" text-anchor="middle" fill="#18181b">governor</text><path d="M375 63 L410 63" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="410" y="30" width="160" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="490.0" y="50.0" font-size="13" text-anchor="middle" fill="#18181b">Governor's party</text><text x="490.0" y="66.0" font-size="13" text-anchor="middle" fill="#18181b">holds over half the</text><text x="490.0" y="82.0" font-size="13" text-anchor="middle" fill="#18181b">legislature</text><path d="M570 63 L605 63" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="605" y="30" width="160" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="685.0" y="58.0" font-size="13" text-anchor="middle" fill="#18181b">State law gives the</text><text x="685.0" y="74.0" font-size="13" text-anchor="middle" fill="#18181b">legislature the pen</text><rect x="20" y="160" width="160" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="100.0" y="180.0" font-size="13" text-anchor="middle" fill="#18181b">Every district</text><text x="100.0" y="196.0" font-size="13" text-anchor="middle" fill="#18181b">within the</text><text x="100.0" y="212.0" font-size="13" text-anchor="middle" fill="#18181b">compactness cap</text><path d="M180 193 L215 193" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="215" y="160" width="160" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="295.0" y="188.0" font-size="13" text-anchor="middle" fill="#18181b">Packed districts</text><text x="295.0" y="204.0" font-size="13" text-anchor="middle" fill="#18181b">within the limit</text><path d="M375 193 L410 193" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="410" y="160" width="160" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="490.0" y="180.0" font-size="13" text-anchor="middle" fill="#18181b">Efficiency gap</text><text x="490.0" y="196.0" font-size="13" text-anchor="middle" fill="#18181b">under the fairness</text><text x="490.0" y="212.0" font-size="13" text-anchor="middle" fill="#18181b">ceiling</text><path d="M570 193 L605 193" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="605" y="160" width="160" height="66" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="685.0" y="196.0" font-size="13" text-anchor="middle" fill="#18181b">Map saved</text><path d="M700 96 L700 128 L100 128 L100 160" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="20" y="260" width="760" height="44" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="400.0" y="285.0" font-size="13" text-anchor="middle" fill="#18181b">Fail any gate and the map is refused. Commission states refuse every proposed map.</text></svg>