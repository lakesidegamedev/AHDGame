<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" font-family="system-ui, sans-serif">
<title>Taoiseach formation</title>
<desc>After a Dail election, a bloc holding a majority nominates a Taoiseach, or a minority bid is made; the Dail confidence vote confirms or rejects.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="419" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="120" y="20" width="230" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="235.0" y="37.0" font-size="12" text-anchor="middle" fill="#18181b">Dail election: 160 seats, 10%</text>
<text x="235.0" y="53.0" font-size="12" text-anchor="middle" fill="#18181b">regional gate</text>
<rect x="430" y="20" width="230" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="545.0" y="45.5" font-size="13" text-anchor="middle" fill="#18181b">Seats shared out by party</text>
<path d="M350 42 L430 42" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="20" y="130" width="360" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="200.0" y="153.0" font-size="12" text-anchor="middle" fill="#18181b">Majority route: a party or coalition with 81 or more</text>
<text x="200.0" y="169.0" font-size="12" text-anchor="middle" fill="#18181b">seats, a bare majority of 160, nominates a Taoiseach</text>
<rect x="420" y="130" width="360" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="600.0" y="153.0" font-size="12" text-anchor="middle" fill="#18181b">Minority bid: a party or coalition chair with 25 or</text>
<text x="600.0" y="169.0" font-size="12" text-anchor="middle" fill="#18181b">more seats proposes a Taoiseach, even without 81</text>
<path d="M545 64 L545 95 L200 95 L200 130" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M545 95 L600 95 L600 130" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="270" y="240" width="260" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="400.0" y="271.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Confidence vote among all TDs</text>
<path d="M200 186 L200 213 L400 213 L400 240" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M600 186 L600 213 L400 213 L400 240" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="130" y="340" width="230" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="245.0" y="365.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Taoiseach confirmed</text>
<rect x="440" y="340" width="230" height="44" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="555.0" y="365.5" font-size="13" text-anchor="middle" fill="#18181b">Bid fails, no Taoiseach yet</text>
<path d="M350 296 L350 318 L245 318 L245 340" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="300" y="312" font-size="12" text-anchor="end" fill="#52525b">passes</text>
<path d="M450 296 L450 318 L555 318 L555 340" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="500" y="312" font-size="12" text-anchor="start" fill="#52525b">fails</text>
</svg>
