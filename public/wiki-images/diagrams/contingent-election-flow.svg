<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif"><title>How a contingent election resolves</title><desc>With no Electoral College majority the House picks the President and the Senate picks the Vice President; a House deadlock seats the VP as acting president while House ballots continue.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="759" height="469" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="280" y="20" width="200" height="44" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="380.0" y="37.0" font-size="13" text-anchor="middle" fill="#18181b">Electoral College: no</text><text x="380.0" y="53.0" font-size="13" text-anchor="middle" fill="#18181b">majority</text><rect x="30" y="100" width="300" height="60" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="180.0" y="117.0" font-size="13" text-anchor="middle" fill="#18181b">House picks the President from the top</text><text x="180.0" y="133.0" font-size="13" text-anchor="middle" fill="#18181b">3 candidates; needs a majority of state</text><text x="180.0" y="149.0" font-size="13" text-anchor="middle" fill="#18181b">delegations</text><rect x="430" y="100" width="300" height="60" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="580.0" y="117.0" font-size="13" text-anchor="middle" fill="#18181b">Senate picks the Vice President from</text><text x="580.0" y="133.0" font-size="13" text-anchor="middle" fill="#18181b">the top 2 tickets; needs a majority of</text><text x="580.0" y="149.0" font-size="13" text-anchor="middle" fill="#18181b">senators</text><path d="M380 64 L380 82 L180 82 L180 100" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M380 82 L580 82 L580 100" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="30" y="210" width="130" height="60" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="95.0" y="235.0" font-size="13" text-anchor="middle" fill="#18181b">President</text><text x="95.0" y="251.0" font-size="13" text-anchor="middle" fill="#18181b">elected</text><rect x="190" y="210" width="190" height="60" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="285.0" y="235.0" font-size="13" text-anchor="middle" fill="#18181b">VP seated as acting</text><text x="285.0" y="251.0" font-size="13" text-anchor="middle" fill="#18181b">president</text><rect x="190" y="300" width="190" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="285.0" y="323.0" font-size="13" text-anchor="middle" fill="#18181b">House ballots every</text><text x="285.0" y="339.0" font-size="13" text-anchor="middle" fill="#18181b">turn, for up to 24 turns</text><rect x="190" y="390" width="190" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="285.0" y="405.0" font-size="13" text-anchor="middle" fill="#18181b">Window ends with no</text><text x="285.0" y="421.0" font-size="13" text-anchor="middle" fill="#18181b">majority: acting</text><text x="285.0" y="437.0" font-size="13" text-anchor="middle" fill="#18181b">president keeps serving</text><rect x="430" y="300" width="300" height="56" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="580.0" y="323.0" font-size="13" text-anchor="middle" fill="#18181b">A chamber has no usable votes: fall</text><text x="580.0" y="339.0" font-size="13" text-anchor="middle" fill="#18181b">back to the Electoral College count</text><path d="M95 160 L95 210" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="103" y="190" font-size="12" text-anchor="start" fill="#52525b">majority</text><path d="M285 160 L285 210" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="293" y="190" font-size="12" text-anchor="start" fill="#52525b">no majority</text><path d="M500 160 L500 240 L380 240" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="508" y="200" font-size="12" text-anchor="start" fill="#52525b">VP picked</text><path d="M285 270 L285 300" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M190 328 L95 328 L95 270" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="142" y="320" font-size="12" text-anchor="middle" fill="#52525b">majority forms</text><path d="M285 356 L285 390" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="293" y="378" font-size="12" text-anchor="start" fill="#52525b">no majority</text><path d="M660 160 L660 300" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arw)"/><text x="652" y="230" font-size="12" text-anchor="end" fill="#52525b">no usable votes</text></svg>