<svg xmlns="http://www.w3.org/2000/svg" width="780" height="404" viewBox="0 0 780 404" role="img" font-family="system-ui, sans-serif">
<title>How impeachment proceeds</title>
<desc>The President path needs a lower chamber vote then an upper chamber vote, each 6 turns and counted against all seats; the governor path is a single two-thirds vote.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="779" height="403" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<g fill="#18181b">
<text x="24" y="30" font-size="14" text-anchor="start" fill="#18181b" font-weight="700">President (two chambers)</text>
<rect x="24" y="44" width="130" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="89.0" y="64.2" font-size="12" text-anchor="middle" font-weight="700">Lower chamber</text>
<text x="89.0" y="80.2" font-size="12" text-anchor="middle">member files</text>
<text x="89.0" y="96.2" font-size="12" text-anchor="middle">articles</text>
<rect x="194" y="44" width="180" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="284.0" y="64.2" font-size="12" text-anchor="middle" font-weight="700">Lower chamber vote</text>
<text x="284.0" y="80.2" font-size="12" text-anchor="middle">6 turns; more than half</text>
<text x="284.0" y="96.2" font-size="12" text-anchor="middle">of all seats</text>
<rect x="414" y="44" width="180" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="504.0" y="64.2" font-size="12" text-anchor="middle" font-weight="700">Upper chamber vote</text>
<text x="504.0" y="80.2" font-size="12" text-anchor="middle">6 turns; two-thirds</text>
<text x="504.0" y="96.2" font-size="12" text-anchor="middle">of all seats</text>
<rect x="634" y="44" width="126" height="64" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="697.0" y="64.2" font-size="12" text-anchor="middle" font-weight="700">Removed</text>
<text x="697.0" y="80.2" font-size="12" text-anchor="middle">VP takes over</text>
<text x="697.0" y="96.2" font-size="12" text-anchor="middle">(in the US)</text>
<polyline points="154,76 194,76" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<polyline points="374,76 414,76" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="394" y="68" font-size="12" text-anchor="middle" fill="#52525b">passes</text>
<polyline points="594,76 634,76" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="614" y="68" font-size="12" text-anchor="middle" fill="#52525b">guilty</text>
<rect x="194" y="148" width="180" height="48" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="284.0" y="168.2" font-size="12" text-anchor="middle" font-weight="700">Short of the bar</text>
<text x="284.0" y="184.2" font-size="12" text-anchor="middle">case ends; refile wait</text>
<rect x="414" y="148" width="180" height="48" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="504.0" y="168.2" font-size="12" text-anchor="middle" font-weight="700">Short of the bar</text>
<text x="504.0" y="184.2" font-size="12" text-anchor="middle">President stays</text>
<polyline points="284,108 284,148" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<polyline points="504,108 504,148" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="24" y="252" font-size="14" text-anchor="start" fill="#18181b" font-weight="700">Governor (one chamber)</text>
<rect x="24" y="266" width="130" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="89.0" y="294.2" font-size="12" text-anchor="middle" font-weight="700">State legislator</text>
<text x="89.0" y="310.2" font-size="12" text-anchor="middle">files</text>
<rect x="194" y="266" width="180" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="284.0" y="286.2" font-size="12" text-anchor="middle" font-weight="700">Conviction vote</text>
<text x="284.0" y="302.2" font-size="12" text-anchor="middle">6 turns; two-thirds of</text>
<text x="284.0" y="318.2" font-size="12" text-anchor="middle">all state seats</text>
<rect x="414" y="266" width="160" height="64" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="494.0" y="302.2" font-size="12" text-anchor="middle">Governor removed</text>
<rect x="594" y="266" width="166" height="64" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="677.0" y="294.2" font-size="12" text-anchor="middle" font-weight="700">Short of the bar</text>
<text x="677.0" y="310.2" font-size="12" text-anchor="middle">governor stays</text>
<polyline points="154,298 194,298" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<polyline points="374,298 414,298" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<polyline points="284,330 284,352 677,352 677,330" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="480" y="346" font-size="12" text-anchor="middle" fill="#52525b">falls short</text>
<text x="24" y="384" font-size="12" text-anchor="start" fill="#52525b">Silent seats count against removal in both paths.</text>
</g>
</svg>
