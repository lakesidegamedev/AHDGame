<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" role="img" font-family="system-ui, sans-serif">
<title>Corporate IMF rescue activation</title>
<desc>A rescue replaces the bonds with an IMF loan, issues new shares to the IMF, stops dividends and CEO pay, cuts the share price; then each turn the payment is capped by income.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker></defs>
<rect x="0.5" y="0.5" width="779" height="359" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="36" width="165" height="100" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="102.5" y="65.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">1. Bonds replaced</text>
<text x="102.5" y="82.0" text-anchor="middle" font-size="13" fill="#18181b">part of their face</text>
<text x="102.5" y="99.0" text-anchor="middle" font-size="13" fill="#18181b">value becomes the</text>
<text x="102.5" y="116.0" text-anchor="middle" font-size="13" fill="#18181b">IMF loan</text>
<rect x="205" y="36" width="165" height="100" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="287.5" y="56.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">2. IMF becomes an</text>
<text x="287.5" y="73.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">owner</text>
<text x="287.5" y="90.5" text-anchor="middle" font-size="13" fill="#18181b">new shares issued;</text>
<text x="287.5" y="107.5" text-anchor="middle" font-size="13" fill="#18181b">everyone else</text>
<text x="287.5" y="124.5" text-anchor="middle" font-size="13" fill="#18181b">diluted</text>
<rect x="390" y="36" width="165" height="100" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="472.5" y="73.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">3. Payouts stop</text>
<text x="472.5" y="90.5" text-anchor="middle" font-size="13" fill="#18181b">dividend and CEO pay</text>
<text x="472.5" y="107.5" text-anchor="middle" font-size="13" fill="#18181b">set to zero</text>
<rect x="575" y="36" width="165" height="100" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="657.5" y="73.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">4. Price discount</text>
<text x="657.5" y="90.5" text-anchor="middle" font-size="13" fill="#18181b">share price carries</text>
<text x="657.5" y="107.5" text-anchor="middle" font-size="13" fill="#18181b">a 0.85 multiplier</text>
<path d="M185,86 L205,86" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M370,86 L390,86" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M555,86 L575,86" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M657,136 L657,190" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="440" y="190" width="300" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
<text x="590.0" y="214.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Each turn after that</text>
<text x="590.0" y="231.0" text-anchor="middle" font-size="13" fill="#18181b">pays the smaller of the scheduled loan</text>
<text x="590.0" y="248.0" text-anchor="middle" font-size="13" fill="#18181b">payment and the income cap (default 35%</text>
<text x="590.0" y="265.0" text-anchor="middle" font-size="13" fill="#18181b">of the turn's income)</text>
<path d="M440,235 L390,235" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="20" y="190" width="370" height="90" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.25"/>
<text x="205.0" y="222.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">If the cap is below the interest</text>
<text x="205.0" y="239.5" text-anchor="middle" font-size="13" fill="#18181b">the unpaid interest is added to the loan, so the</text>
<text x="205.0" y="256.5" text-anchor="middle" font-size="13" fill="#18181b">loan grows and the schedule stretches</text>
<text x="20" y="320" text-anchor="start" font-size="12" fill="#52525b" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">While the rescue is active, no new corporate bonds can be issued.</text>
</svg>
