<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" font-family="system-ui, sans-serif"><title>Path of a referendum request</title><desc>Desire builds, the First Minister files a request, the Prime Minister grants or declines, a campaign and vote follow, and a pass opens a consent window before the region transfers.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="799" height="379" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="30" width="160" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="100.0" y="58.0" font-size="13" text-anchor="middle" fill="#18181b">Regional desire</text><text x="100.0" y="74.0" font-size="13" text-anchor="middle" fill="#18181b">builds each turn</text><rect x="215" y="30" width="160" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="295.0" y="50.0" font-size="13" text-anchor="middle" fill="#18181b">First Minister</text><text x="295.0" y="66.0" font-size="13" text-anchor="middle" fill="#18181b">files at desire 60</text><text x="295.0" y="82.0" font-size="13" text-anchor="middle" fill="#18181b">(3 office actions)</text><rect x="410" y="30" width="160" height="66" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="490.0" y="58.0" font-size="13" text-anchor="middle" fill="#18181b">Prime Minister</text><text x="490.0" y="74.0" font-size="13" text-anchor="middle" fill="#18181b">decides</text><rect x="620" y="30" width="160" height="66" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="700.0" y="58.0" font-size="13" text-anchor="middle" fill="#18181b">Campaign runs for</text><text x="700.0" y="74.0" font-size="13" text-anchor="middle" fill="#18181b">48 turns</text><rect x="410" y="160" width="160" height="66" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="490.0" y="180.0" font-size="13" text-anchor="middle" fill="#18181b">Declined: +5</text><text x="490.0" y="196.0" font-size="13" text-anchor="middle" fill="#18181b">desire, 96-turn</text><text x="490.0" y="212.0" font-size="13" text-anchor="middle" fill="#18181b">lockout</text><rect x="605" y="160" width="175" height="66" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="692.5" y="188.0" font-size="13" text-anchor="middle" fill="#18181b">Vote: Yes must finish</text><text x="692.5" y="204.0" font-size="13" text-anchor="middle" fill="#18181b">above 50%</text><rect x="410" y="290" width="160" height="76" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="490.0" y="315.0" font-size="13" text-anchor="middle" fill="#18181b">Fails: desire</text><text x="490.0" y="331.0" font-size="13" text-anchor="middle" fill="#18181b">pulled toward 30,</text><text x="490.0" y="347.0" font-size="13" text-anchor="middle" fill="#18181b">480-turn cooldown</text><rect x="605" y="290" width="175" height="76" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="692.5" y="307.0" font-size="13" text-anchor="middle" fill="#18181b">Passes: 24-turn</text><text x="692.5" y="323.0" font-size="13" text-anchor="middle" fill="#18181b">consent window,</text><text x="692.5" y="339.0" font-size="13" text-anchor="middle" fill="#18181b">consent bills, region</text><text x="692.5" y="355.0" font-size="13" text-anchor="middle" fill="#18181b">transfers</text><path d="M180 63 L215 63" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M375 63 L410 63" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M570 55 L620 55" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="595" y="46" font-size="12" text-anchor="middle" fill="#52525b">grants</text><path d="M490 96 L490 160" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arw)"/><text x="498" y="132" font-size="12" text-anchor="start" fill="#52525b">declines</text><path d="M410 193 L100 193 L100 96" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="250" y="186" font-size="12" text-anchor="middle" fill="#52525b">desire builds again</text><path d="M692 96 L692 160" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M740 226 L740 290" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="748" y="262" font-size="12" text-anchor="start" fill="#52525b">passes</text><path d="M640 226 L640 260 L490 260 L490 290" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arw)"/><text x="565" y="254" font-size="12" text-anchor="middle" fill="#52525b">fails</text></svg>