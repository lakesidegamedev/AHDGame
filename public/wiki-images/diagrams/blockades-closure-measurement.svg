<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" font-family="system-ui, sans-serif"><title>How blockade closure is measured</title><desc>Hostile hulls on Blockade or Sea Denial create lane pressure, set against port defence to give approach closure; the worst approach becomes country closure, which scales trade affinity and so commodity prices.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="759" height="329" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="30" width="200" height="76" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="120.0" y="55.0" font-size="13" text-anchor="middle" fill="#18181b">War, plus hostile hulls</text><text x="120.0" y="71.0" font-size="13" text-anchor="middle" fill="#18181b">on Blockade or Sea Denial</text><text x="120.0" y="87.0" font-size="13" text-anchor="middle" fill="#18181b">in an approach region</text><rect x="280" y="30" width="200" height="76" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="380.0" y="63.0" font-size="13" text-anchor="middle" fill="#18181b">Lane pressure, adjusted</text><text x="380.0" y="79.0" font-size="13" text-anchor="middle" fill="#18181b">for each hull's condition</text><rect x="540" y="30" width="200" height="76" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="640.0" y="63.0" font-size="13" text-anchor="middle" fill="#18181b">Approach closure, from 0</text><text x="640.0" y="79.0" font-size="13" text-anchor="middle" fill="#18181b">to 1</text><rect x="540" y="160" width="200" height="52" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="640.0" y="181.0" font-size="13" text-anchor="middle" fill="#18181b">Port defence, from the</text><text x="640.0" y="197.0" font-size="13" text-anchor="middle" fill="#18181b">region's port rating</text><path d="M220 68 L280 68" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M480 68 L540 68" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="510" y="58" font-size="12" text-anchor="middle" fill="#52525b">versus</text><path d="M640 160 L640 106" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><rect x="540" y="250" width="200" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="640.0" y="273.0" font-size="13" text-anchor="middle" fill="#18181b">Country closure: the</text><text x="640.0" y="289.0" font-size="13" text-anchor="middle" fill="#18181b">worst single approach</text><rect x="280" y="250" width="200" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="380.0" y="273.0" font-size="13" text-anchor="middle" fill="#18181b">Trade affinity times (1</text><text x="380.0" y="289.0" font-size="13" text-anchor="middle" fill="#18181b">minus closure)</text><rect x="20" y="250" width="200" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="120.0" y="281.0" font-size="13" text-anchor="middle" fill="#18181b">Commodity prices</text><path d="M740 68 L752 68 L752 278 L740 278" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><path d="M540 278 L480 278" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M280 278 L220 278" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="375" y="242" font-size="12" text-anchor="middle" fill="#52525b">scales each flow touching the country</text></svg>