<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400" role="img" font-family="system-ui, sans-serif"><title>Contracted and open-access capacity</title><desc>State resource capacity splits into a contracted pool and an open-access pool; uncontracted extraction output is squeezed proportionally when demand exceeds the open pool, which sets commodity supply, price and margins. Prospecting and R&amp;D expand capacity.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="739" height="399" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="60" width="170" height="60" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="105.0" y="85.0" font-size="13" text-anchor="middle" fill="#18181b">State resource</text><text x="105.0" y="101.0" font-size="13" text-anchor="middle" fill="#18181b">capacity</text><rect x="250" y="30" width="230" height="76" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="365.0" y="47.0" font-size="13" text-anchor="middle" fill="#18181b">Contracted pool: reserved for</text><text x="365.0" y="63.0" font-size="13" text-anchor="middle" fill="#18181b">contract holders, with</text><text x="365.0" y="79.0" font-size="13" text-anchor="middle" fill="#18181b">offered plus active share</text><text x="365.0" y="95.0" font-size="13" text-anchor="middle" fill="#18181b">capped at 75%</text><rect x="250" y="130" width="230" height="60" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="365.0" y="155.0" font-size="13" text-anchor="middle" fill="#18181b">Open-access pool: shared by</text><text x="365.0" y="171.0" font-size="13" text-anchor="middle" fill="#18181b">all other extraction sectors</text><rect x="530" y="60" width="190" height="76" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="625.0" y="85.0" font-size="13" text-anchor="middle" fill="#18181b">Sector output: squeezed</text><text x="625.0" y="101.0" font-size="13" text-anchor="middle" fill="#18181b">in proportion if demand</text><text x="625.0" y="117.0" font-size="13" text-anchor="middle" fill="#18181b">exceeds the open pool</text><rect x="530" y="176" width="190" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="625.0" y="199.0" font-size="13" text-anchor="middle" fill="#18181b">Commodity supply</text><rect x="530" y="246" width="190" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="625.0" y="269.0" font-size="13" text-anchor="middle" fill="#18181b">Commodity price</text><rect x="530" y="316" width="190" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="625.0" y="339.0" font-size="13" text-anchor="middle" fill="#18181b">Sector margins</text><rect x="20" y="260" width="190" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="115.0" y="296.0" font-size="13" text-anchor="middle" fill="#18181b">Prospecting and R&amp;D</text><path d="M190 80 L220 80 L220 68 L250 68" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M190 100 L220 100 L220 160 L250 160" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M480 68 L505 68 L505 90 L530 90" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M480 160 L505 160 L505 110 L530 110" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M625 136 L625 176" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M625 216 L625 246" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M625 286 L625 316" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M115 260 L115 120" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="123" y="200" font-size="12" text-anchor="start" fill="#52525b">expand capacity</text></svg>