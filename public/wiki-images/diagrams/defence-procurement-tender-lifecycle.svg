<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" font-family="system-ui, sans-serif">
<title>Tender lifecycle</title>
<desc>A defence tender is published with its maximum value reserved, receives sealed bids, closes and is awarded with a public reason. The winning plant builds on up to 4 production lines and delivers up to a per turn cap, then completes, or is terminated for cause at no cost or for convenience with a break fee and political cost.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="779" height="469" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<text x="18" y="28" font-size="15" fill="#18181b" text-anchor="start" font-weight="700">Life of a defence tender</text>
<rect x="20" y="40" width="170" height="80" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="105.0" y="66.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Publish</text>
<text x="105.0" y="83.5" font-size="13" fill="#18181b" text-anchor="middle">Maximum value is</text>
<text x="105.0" y="100.5" font-size="13" fill="#18181b" text-anchor="middle">reserved</text>
<rect x="210" y="40" width="170" height="80" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="295.0" y="66.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Sealed bids</text>
<text x="295.0" y="83.5" font-size="13" fill="#18181b" text-anchor="middle">Domestic plants bid</text>
<text x="295.0" y="100.5" font-size="13" fill="#18181b" text-anchor="middle">inside a price band</text>
<rect x="400" y="40" width="170" height="80" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="485.0" y="66.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Bidding closes</text>
<text x="485.0" y="83.5" font-size="13" fill="#18181b" text-anchor="middle">Bids stay sealed until</text>
<text x="485.0" y="100.5" font-size="13" fill="#18181b" text-anchor="middle">now</text>
<rect x="590" y="40" width="170" height="80" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="675.0" y="66.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Award</text>
<text x="675.0" y="83.5" font-size="13" fill="#18181b" text-anchor="middle">Public reason; unused</text>
<text x="675.0" y="100.5" font-size="13" fill="#18181b" text-anchor="middle">reserve released</text>
<path d="M190 80 L210 80" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M380 80 L400 80" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M570 80 L590 80" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="590" y="190" width="170" height="80" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="675.0" y="208.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Production lines</text>
<text x="675.0" y="225.0" font-size="13" fill="#18181b" text-anchor="middle">Up to 4 per plant,</text>
<text x="675.0" y="242.0" font-size="13" fill="#18181b" text-anchor="middle">shared across its</text>
<text x="675.0" y="259.0" font-size="13" fill="#18181b" text-anchor="middle">orders</text>
<path d="M675 120 L675 190" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="400" y="190" width="170" height="80" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="485.0" y="216.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Deliveries</text>
<text x="485.0" y="233.5" font-size="13" fill="#18181b" text-anchor="middle">Paid per turn, up to a</text>
<text x="485.0" y="250.5" font-size="13" fill="#18181b" text-anchor="middle">country cap</text>
<path d="M590 230 L570 230" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="210" y="190" width="170" height="80" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="295.0" y="225.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Complete</text>
<text x="295.0" y="242.0" font-size="13" fill="#18181b" text-anchor="middle">Order finished</text>
<path d="M400 230 L380 230" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="330" y="340" width="200" height="110" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="430.0" y="364.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Terminate for cause</text>
<text x="430.0" y="381.5" font-size="13" fill="#18181b" text-anchor="middle">3 missed delivery turns in</text>
<text x="430.0" y="398.5" font-size="13" fill="#18181b" text-anchor="middle">a row for the supplier's</text>
<text x="430.0" y="415.5" font-size="13" fill="#18181b" text-anchor="middle">own reasons. Free, tranche</text>
<text x="430.0" y="432.5" font-size="13" fill="#18181b" text-anchor="middle">handed back</text>
<rect x="560" y="340" width="200" height="110" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="660.0" y="356.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">Terminate for</text>
<text x="660.0" y="373.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">convenience</text>
<text x="660.0" y="390.0" font-size="13" fill="#18181b" text-anchor="middle">Break fee out of the</text>
<text x="660.0" y="407.0" font-size="13" fill="#18181b" text-anchor="middle">appropriation now, tranche</text>
<text x="660.0" y="424.0" font-size="13" fill="#18181b" text-anchor="middle">stays spent, minister</text>
<text x="660.0" y="441.0" font-size="13" fill="#18181b" text-anchor="middle">named publicly</text>
<path d="M460 270 L460 340" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#mn)"/>
<path d="M520 270 L520 300 L660 300 L660 340" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
</svg>
