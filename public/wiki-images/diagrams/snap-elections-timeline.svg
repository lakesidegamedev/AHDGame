<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" role="img" font-family="system-ui, sans-serif"><title>How a snap election unfolds</title><desc>Either a Prime Minister's call or the vacancy clock triggers a snap; lower-chamber elections are cancelled, bills fail, the PM seat is vacated, a 48-turn snap runs, and the next regular election is anchored to its end.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="779" height="329" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="30" width="300" height="130" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="170.0" y="66.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">Prime Minister calls it</text><text x="170.0" y="82.0" font-size="13" text-anchor="middle" fill="#18181b">only if snaps are allowed, the</text><text x="170.0" y="98.0" font-size="13" text-anchor="middle" fill="#18181b">government is formed, fewer than 2</text><text x="170.0" y="114.0" font-size="13" text-anchor="middle" fill="#18181b">used, past the cooldown, and no</text><text x="170.0" y="130.0" font-size="13" text-anchor="middle" fill="#18181b">no-confidence vote is pending</text><rect x="20" y="190" width="300" height="70" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="170.0" y="212.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">Or the PM vacancy clock</text><text x="170.0" y="228.0" font-size="13" text-anchor="middle" fill="#18181b">runs out (96 turns) and the game calls</text><text x="170.0" y="244.0" font-size="13" text-anchor="middle" fill="#18181b">it</text><rect x="380" y="60" width="170" height="130" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="465.0" y="88.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">On a successful snap</text><text x="465.0" y="104.0" font-size="13" text-anchor="middle" fill="#18181b">lower-chamber</text><text x="465.0" y="120.0" font-size="13" text-anchor="middle" fill="#18181b">elections are</text><text x="465.0" y="136.0" font-size="13" text-anchor="middle" fill="#18181b">cancelled, bills</text><text x="465.0" y="152.0" font-size="13" text-anchor="middle" fill="#18181b">fail, the PM seat is</text><text x="465.0" y="168.0" font-size="13" text-anchor="middle" fill="#18181b">vacated</text><rect x="600" y="60" width="160" height="130" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="680.0" y="104.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">Snap election</text><text x="680.0" y="120.0" font-size="13" text-anchor="middle" fill="#18181b">48 turns: 24 of</text><text x="680.0" y="136.0" font-size="13" text-anchor="middle" fill="#18181b">primary, then 24 of</text><text x="680.0" y="152.0" font-size="13" text-anchor="middle" fill="#18181b">general</text><rect x="380" y="230" width="380" height="70" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="570.0" y="260.0" font-size="13" text-anchor="middle" fill="#18181b">Next regular election: snap end turn + 240 (UK) or</text><text x="570.0" y="276.0" font-size="13" text-anchor="middle" fill="#18181b">+ 192 (JP, DE, IE)</text><path d="M320 95 L350 95 L350 125 L380 125" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M320 225 L350 225 L350 125 L380 125" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M550 125 L600 125" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M680 190 L680 230" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="670" y="214" font-size="12" text-anchor="end" fill="#52525b">re-anchors the cycle</text></svg>