<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" font-family="system-ui, sans-serif">
<title>What drives inflation</title>
<desc>Prime rate, output gap, unemployment, commodity prices, fiscal stance, exchange rate, savings flow, and tariffs and wages all push inflation, which in turn affects corporate margins and central bank chair scrutiny.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker></defs>
<rect x="0.5" y="0.5" width="779" height="469" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="20" width="260" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="150.0" y="44.5" text-anchor="middle" font-size="13" fill="#18181b">Prime rate vs neutral rate</text>
<path d="M280,40 L350,188.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="20" y="74" width="260" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="150.0" y="98.5" text-anchor="middle" font-size="13" fill="#18181b">Output gap</text>
<path d="M280,94 L350,195.5" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="20" y="128" width="260" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="150.0" y="152.5" text-anchor="middle" font-size="13" fill="#18181b">Unemployment</text>
<path d="M280,148 L350,203.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="20" y="182" width="260" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="150.0" y="206.5" text-anchor="middle" font-size="13" fill="#18181b">Commodity prices</text>
<path d="M280,202 L350,210.5" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="20" y="236" width="260" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="150.0" y="260.5" text-anchor="middle" font-size="13" fill="#18181b">Fiscal stance: deficit or surplus</text>
<path d="M280,256 L350,218.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="20" y="290" width="260" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="150.0" y="314.5" text-anchor="middle" font-size="13" fill="#18181b">Exchange rate</text>
<path d="M280,310 L350,225.5" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="20" y="344" width="260" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="150.0" y="368.5" text-anchor="middle" font-size="13" fill="#18181b">Savings flow</text>
<path d="M280,364 L350,233.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="20" y="398" width="260" height="40" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="150.0" y="422.5" text-anchor="middle" font-size="13" fill="#18181b">Tariffs and wage growth</text>
<path d="M280,418 L350,240.5" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="350" y="175" width="150" height="100" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
<text x="425.0" y="204.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Inflation</text>
<text x="425.0" y="221.0" text-anchor="middle" font-size="13" fill="#18181b">moves toward a</text>
<text x="425.0" y="238.0" text-anchor="middle" font-size="13" fill="#18181b">target built from</text>
<text x="425.0" y="255.0" text-anchor="middle" font-size="13" fill="#18181b">all of these</text>
<path d="M500,205 L560,140" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M500,245 L560,320" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="560" y="90" width="200" height="100" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="660.0" y="127.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Corporate margins</text>
<text x="660.0" y="144.5" text-anchor="middle" font-size="13" fill="#18181b">inflation far from target</text>
<text x="660.0" y="161.5" text-anchor="middle" font-size="13" fill="#18181b">hurts every sector</text>
<rect x="560" y="270" width="200" height="100" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="660.0" y="299.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Central bank chair</text>
<text x="660.0" y="316.0" text-anchor="middle" font-size="13" fill="#18181b">is judged against the</text>
<text x="660.0" y="333.0" text-anchor="middle" font-size="13" fill="#18181b">inflation target</text>
<text x="660.0" y="350.0" text-anchor="middle" font-size="13" fill="#18181b">(scrutiny)</text>
</svg>
