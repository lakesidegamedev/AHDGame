<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" font-family="system-ui, sans-serif">
<title>From influence to alignment to sphere</title>
<desc>Influence plays, aid, passive drift and organization pull move alignment shares; the lead and sustained shares decide bloc join or leave and sphere; bloc stress feeds back by weakening plays.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="399" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="30" width="190" height="120" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="30" y="59.5" font-size="13" text-anchor="start" fill="#18181b">What moves shares</text>
<text x="30" y="76.5" font-size="13" text-anchor="start" fill="#18181b">- influence plays</text>
<text x="30" y="93.5" font-size="13" text-anchor="start" fill="#18181b">- aid</text>
<text x="30" y="110.5" font-size="13" text-anchor="start" fill="#18181b">- passive drift</text>
<text x="30" y="127.5" font-size="13" text-anchor="start" fill="#18181b">- organization pull</text>
<rect x="270" y="30" width="200" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="370.0" y="53.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Alignment shares per</text>
<text x="370.0" y="70.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">pole, plus uncommitted</text>
<path d="M210 58 L270 58" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="270" y="130" width="200" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="370.0" y="147.0" font-size="13" text-anchor="middle" fill="#18181b">Lead: top pole over the</text>
<text x="370.0" y="164.0" font-size="13" text-anchor="middle" fill="#18181b">next</text>
<path d="M370 86 L370 130" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="270" y="220" width="200" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="370.0" y="243.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Lead clears the</text>
<text x="370.0" y="260.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">commitment gate: a sphere</text>
<path d="M370 174 L370 220" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="540" y="30" width="240" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="660.0" y="53.0" font-size="13" text-anchor="middle" fill="#18181b">Share held past a threshold for</text>
<text x="660.0" y="70.0" font-size="13" text-anchor="middle" fill="#18181b">long enough</text>
<path d="M470 58 L540 58" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="540" y="130" width="240" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="660.0" y="155.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Nation joins or leaves a bloc</text>
<path d="M660 86 L660 130" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="540" y="220" width="240" height="70" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="660.0" y="241.5" font-size="13" text-anchor="middle" fill="#18181b">Bloc stress: contested members,</text>
<text x="660.0" y="258.5" font-size="13" text-anchor="middle" fill="#18181b">members wanting out, recent</text>
<text x="660.0" y="275.5" font-size="13" text-anchor="middle" fill="#18181b">joiners</text>
<path d="M660 174 L660 220" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="668" y="201" font-size="12" text-anchor="start" fill="#52525b">bloc members</text>
<rect x="540" y="330" width="240" height="44" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="660.0" y="355.5" font-size="13" text-anchor="middle" fill="#18181b">Plays work at reduced strength</text>
<path d="M660 290 L660 330" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<path d="M540 352 L115 352 L115 150" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="330" y="344" font-size="12" text-anchor="middle" fill="#52525b">weaker influence plays</text>
</svg>
