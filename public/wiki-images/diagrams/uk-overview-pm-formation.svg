<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" font-family="system-ui, sans-serif">
<title>UK Prime Minister formation</title>
<desc>After Commons results, a qualifying party or coalition chair proposes a PM for a confidence vote; other qualifying chairs may bid after a failure. A minority bid is possible, and a successful no-confidence vote clears the cabinet.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="419" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="20" width="220" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="130.0" y="37.0" font-size="13" text-anchor="middle" fill="#18181b">Commons election: 12</text>
<text x="130.0" y="54.0" font-size="13" text-anchor="middle" fill="#18181b">regional results</text>
<rect x="280" y="20" width="200" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="380.0" y="45.5" font-size="13" text-anchor="middle" fill="#18181b">Seats summed by party</text>
<rect x="520" y="20" width="260" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="650.0" y="45.5" font-size="13" text-anchor="middle" fill="#18181b">Party or coalition chair proposes PM</text>
<path d="M240 42 L280 42" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M480 42 L520 42" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="320" y="130" width="240" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="440.0" y="155.5" font-size="13" text-anchor="middle" fill="#18181b">Confidence vote: 326 of 650 MPs</text>
<path d="M650 64 L650 95 L440 95 L440 130" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="620" y="130" width="160" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="700.0" y="155.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">PM confirmed</text>
<path d="M560 152 L620 152" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="590" y="144" font-size="12" text-anchor="middle" fill="#52525b">passes</text>
<rect x="20" y="130" width="240" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="140.0" y="147.0" font-size="13" text-anchor="middle" fill="#18181b">Another qualifying chair</text>
<text x="140.0" y="164.0" font-size="13" text-anchor="middle" fill="#18181b">may propose a PM</text>
<path d="M320 152 L260 152" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="290" y="144" font-size="12" text-anchor="middle" fill="#52525b">fails</text>
<path d="M140 174 L140 215 L400 215 L400 174" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="270" y="209" font-size="12" text-anchor="middle" fill="#52525b">vote again</text>
<rect x="320" y="250" width="250" height="70" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="445.0" y="272.0" font-size="12" text-anchor="middle" fill="#18181b">Minority bid: a party or coalition</text>
<text x="445.0" y="288.0" font-size="12" text-anchor="middle" fill="#18181b">chair with 100 or more seats can</text>
<text x="445.0" y="304.0" font-size="12" text-anchor="middle" fill="#18181b">call a vote and propose a PM</text>
<path d="M520 250 L520 174" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="560" y="350" width="220" height="56" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="670.0" y="365.0" font-size="12" text-anchor="middle" fill="#18181b">No-confidence vote passes: PM</text>
<text x="670.0" y="381.0" font-size="12" text-anchor="middle" fill="#18181b">removed, cabinet cleared,</text>
<text x="670.0" y="397.0" font-size="12" text-anchor="middle" fill="#18181b">formation restarts</text>
<path d="M700 174 L700 350" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="708" y="262" font-size="12" text-anchor="start" fill="#52525b">PM later</text>
<text x="708" y="276" font-size="12" text-anchor="start" fill="#52525b">removed</text>
</svg>
