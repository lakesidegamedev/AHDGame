<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" font-family="system-ui, sans-serif">
<title>Japan snap election cycle</title>
<desc>The PM dissolves the Shugiin under limits, the PM seat is vacated, snap elections run in all regions for 48 hours, then a confidence vote seats a PM, or an automatic snap follows.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="399" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="20" width="760" height="52" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="400.0" y="41.0" font-size="12" text-anchor="middle" fill="#18181b">Limits: only the sitting PM; at most 2 snaps per PM appointment; 336-turn cooldown from the previous snap; not</text>
<text x="400.0" y="57.0" font-size="12" text-anchor="middle" fill="#18181b">while a no-confidence vote is open; the Sangiin cannot be dissolved</text>
<rect x="20" y="110" width="170" height="50" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="105.0" y="130.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">PM dissolves the</text>
<text x="105.0" y="147.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Shugiin</text>
<rect x="230" y="110" width="170" height="50" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="315.0" y="130.0" font-size="12" text-anchor="middle" fill="#18181b">PM seat vacated,</text>
<text x="315.0" y="146.0" font-size="12" text-anchor="middle" fill="#18181b">cabinet cleared</text>
<rect x="440" y="110" width="170" height="50" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="525.0" y="130.0" font-size="12" text-anchor="middle" fill="#18181b">Snap elections in all 8</text>
<text x="525.0" y="146.0" font-size="12" text-anchor="middle" fill="#18181b">regions, 48 hour window</text>
<rect x="650" y="110" width="130" height="50" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="715.0" y="130.0" font-size="13" text-anchor="middle" fill="#18181b">New Shugiin</text>
<text x="715.0" y="147.0" font-size="13" text-anchor="middle" fill="#18181b">seated</text>
<path d="M190 135 L230 135" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M400 135 L440 135" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M610 135 L650 135" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<path d="M400 72 L400 90 L105 90 L105 110" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mg)"/>
<rect x="590" y="210" width="190" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="685.0" y="233.0" font-size="13" text-anchor="middle" fill="#18181b">Confidence vote in the</text>
<text x="685.0" y="250.0" font-size="13" text-anchor="middle" fill="#18181b">new Shugiin</text>
<path d="M715 160 L715 210" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="300" y="210" width="200" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="400.0" y="241.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">New PM confirmed</text>
<path d="M590 238 L500 238" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="545" y="230" font-size="12" text-anchor="middle" fill="#52525b">passes</text>
<rect x="590" y="310" width="190" height="64" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="685.0" y="337.0" font-size="12" text-anchor="middle" fill="#18181b">No PM seated within 96</text>
<text x="685.0" y="353.0" font-size="12" text-anchor="middle" fill="#18181b">turns: automatic snap</text>
<path d="M685 266 L685 310" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="693" y="293" font-size="12" text-anchor="start" fill="#52525b">no PM yet</text>
<path d="M590 342 L525 342 L525 160" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
</svg>
