<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" role="img" font-family="system-ui, sans-serif">
<title>Nigerian presidential spread rule</title>
<desc>The candidate with most national votes wins outright only with at least 25% in at least 4 of 6 zones; otherwise the top two go to a run-off.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="779" height="329" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="190" y="20" width="400" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="390.0" y="45.5" font-size="13" text-anchor="middle" fill="#18181b">Count the national vote: the leader has the most votes</text>
<rect x="190" y="100" width="400" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="390.0" y="123.0" font-size="13" text-anchor="middle" fill="#18181b">Does the leader have at least 25% of the vote in at</text>
<text x="390.0" y="140.0" font-size="13" text-anchor="middle" fill="#18181b">least 4 of the 6 zones?</text>
<path d="M390 64 L390 100" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="60" y="210" width="270" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="195.0" y="241.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Yes: the leader wins outright</text>
<rect x="450" y="210" width="270" height="56" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="585.0" y="233.0" font-size="13" text-anchor="middle" fill="#18181b">No: the top two candidates go to a</text>
<text x="585.0" y="250.0" font-size="13" text-anchor="middle" fill="#18181b">run-off</text>
<path d="M390 156 L390 183 L195 183 L195 210" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="200" y="176" font-size="12" text-anchor="start" fill="#52525b">yes</text>
<path d="M390 183 L585 183 L585 210" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="580" y="176" font-size="12" text-anchor="end" fill="#52525b">no</text>
<text x="20" y="304" font-size="12" text-anchor="start" fill="#52525b">The spread test counts zones, not a national majority.</text>
</svg>
