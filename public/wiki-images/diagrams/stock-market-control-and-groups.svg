<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" role="img" font-family="system-ui, sans-serif">
<title>Corporate control, groups and takeovers</title>
<desc>Holding over half the voting power makes a corporation a de facto subsidiary. Formalizing the relationship forms a group with loss relief and synergies. Holding at least 75 percent of shares allows a hostile takeover and squeeze-out.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="343" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="20" width="200" height="64" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="120.0" y="48.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Holds over 50%</text>
<text x="120.0" y="64.5" font-size="12" text-anchor="middle" fill="#3f3f46">of voting power</text>
<path d="M222 52 L268 52" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="270" y="20" width="250" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="395.0" y="40.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">De facto subsidiary</text>
<text x="395.0" y="56.5" font-size="12" text-anchor="middle" fill="#3f3f46">shown on the page and exchange;</text>
<text x="395.0" y="72.5" font-size="12" text-anchor="middle" fill="#3f3f46">feeds the share-price formula</text>
<path d="M522 52 L568 52" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="570" y="20" width="170" height="64" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="655.0" y="48.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">CEO formalizes</text>
<text x="655.0" y="64.5" font-size="12" text-anchor="middle" fill="#3f3f46">the relationship</text>
<path d="M655 86 L655 138" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="270" y="140" width="470" height="92" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="505.0" y="166.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Group</text>
<text x="505.0" y="182.6" font-size="12" text-anchor="middle" fill="#3f3f46">consolidated view; members keep their own books</text>
<text x="505.0" y="198.6" font-size="12" text-anchor="middle" fill="#3f3f46">loss relief within one country, no carry-forward</text>
<text x="505.0" y="214.6" font-size="12" text-anchor="middle" fill="#3f3f46">synergies lift members, never lower them</text>
<rect x="20" y="270" width="230" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="135.0" y="294.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">At least 75% of shares</text>
<text x="135.0" y="310.6" font-size="12" text-anchor="middle" fill="#3f3f46">a separate route</text>
<path d="M252 298 L318 298" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="320" y="270" width="420" height="56" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="530.0" y="294.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Hostile takeover and squeeze-out</text>
<text x="530.0" y="310.6" font-size="12" text-anchor="middle" fill="#3f3f46">minority paid 125% of market price</text>
</svg>
