<text x="302.5" y="108.5" font-size="12" text-anchor="middle" fill="#3f3f46">climb toward PI 40</text>
<text x="302.5" y="124.5" font-size="12" text-anchor="middle" fill="#3f3f46">request endorsements</text>
<text x="302.5" y="140.6" font-size="12" text-anchor="middle" fill="#3f3f46">do not Attack your</text>
<text x="302.5" y="156.6" font-size="12" text-anchor="middle" fill="#3f3f46">own party</text>
