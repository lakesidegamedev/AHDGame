<text x="107.5" y="92.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Targets</text>
<text x="107.5" y="108.5" font-size="12" text-anchor="middle" fill="#3f3f46">PI about 30</text>
<text x="107.5" y="124.5" font-size="12" text-anchor="middle" fill="#3f3f46">Favorability 60 or higher</text>
<text x="107.5" y="140.6" font-size="12" text-anchor="middle" fill="#3f3f46">donor level 3</text>
<text x="107.5" y="156.6" font-size="12" text-anchor="middle" fill="#3f3f46">read the poll</text>
