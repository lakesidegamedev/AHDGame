<text x="497.5" y="51.5" font-size="12" text-anchor="middle" fill="#3f3f46">you are the nominee</text>
<rect x="410" y="70" width="175" height="100" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="497.5" y="92.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Targets</text>
<text x="497.5" y="108.5" font-size="12" text-anchor="middle" fill="#3f3f46">hold PI</text>
<text x="497.5" y="124.5" font-size="12" text-anchor="middle" fill="#3f3f46">Favorability 65 to 70</text>
<text x="497.5" y="140.6" font-size="12" text-anchor="middle" fill="#3f3f46">ads every other day</text>
<text x="497.5" y="156.6" font-size="12" text-anchor="middle" fill="#3f3f46">general endorsements</text>
