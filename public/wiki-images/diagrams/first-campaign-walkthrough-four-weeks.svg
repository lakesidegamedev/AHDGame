<svg xmlns="http://www.w3.org/2000/svg" width="800" height="302" viewBox="0 0 800 302" role="img" font-family="system-ui, sans-serif">
<title>Four-week first campaign timeline</title>
<desc>Week one builds PI, Favorability and donor level, week two is the primary, week three the general, and week four the last four turns, with the day-one ledger of actions and funds.</desc>
