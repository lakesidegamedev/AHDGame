<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" font-family="system-ui, sans-serif">
<title>Sovereign default timeline</title>
<desc>From a yearly bond auction through three failures, the executive window, chamber votes and a resolution, to the lockout, scar and recovery that follow.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker></defs>
<rect x="0.5" y="0.5" width="779" height="439" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="40" width="155" height="104" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="97.5" y="62.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">1. Yearly auction</text>
<text x="97.5" y="79.5" text-anchor="middle" font-size="13" fill="#18181b">The country's</text>
<text x="97.5" y="96.5" text-anchor="middle" font-size="13" fill="#18181b">bonds are tested</text>
<text x="97.5" y="113.5" text-anchor="middle" font-size="13" fill="#18181b">against investor</text>
<text x="97.5" y="130.5" text-anchor="middle" font-size="13" fill="#18181b">demand</text>
<rect x="215" y="40" width="155" height="104" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.25"/>
<text x="292.5" y="62.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">2. Crisis</text>
<text x="292.5" y="79.5" text-anchor="middle" font-size="13" fill="#18181b">Three failed</text>
<text x="292.5" y="96.5" text-anchor="middle" font-size="13" fill="#18181b">auctions in a row</text>
<text x="292.5" y="113.5" text-anchor="middle" font-size="13" fill="#18181b">(demand ratio</text>
<text x="292.5" y="130.5" text-anchor="middle" font-size="13" fill="#18181b">under 0.7)</text>
<rect x="410" y="40" width="155" height="104" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="487.5" y="54.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">3. Executive</text>
<text x="487.5" y="71.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">window</text>
<text x="487.5" y="88.0" text-anchor="middle" font-size="13" fill="#18181b">12 turns to pick a</text>
<text x="487.5" y="105.0" text-anchor="middle" font-size="13" fill="#18181b">resolution;</text>
<text x="487.5" y="122.0" text-anchor="middle" font-size="13" fill="#18181b">silence means</text>
<text x="487.5" y="139.0" text-anchor="middle" font-size="13" fill="#18181b">Repudiate</text>
<rect x="605" y="40" width="155" height="104" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="682.5" y="54.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">4. Legislature</text>
<text x="682.5" y="71.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">votes</text>
<text x="682.5" y="88.0" text-anchor="middle" font-size="13" fill="#18181b">24 turns per</text>
<text x="682.5" y="105.0" text-anchor="middle" font-size="13" fill="#18181b">chamber; a</text>
<text x="682.5" y="122.0" text-anchor="middle" font-size="13" fill="#18181b">rejection or tie</text>
<text x="682.5" y="139.0" text-anchor="middle" font-size="13" fill="#18181b">means Repudiate</text>
<path d="M175,90 L215,90" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M370,90 L410,90" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M565,90 L605,90" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M682,144 L682,175 L100,175 L100,215" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="20" y="215" width="160" height="120" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
<text x="100.0" y="254.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">5. Resolution</text>
<text x="100.0" y="271.0" text-anchor="middle" font-size="13" fill="#18181b">takes effect; three</text>
<text x="100.0" y="288.0" text-anchor="middle" font-size="13" fill="#18181b">things then start</text>
<text x="100.0" y="305.0" text-anchor="middle" font-size="13" fill="#18181b">together</text>
<rect x="270" y="200" width="490" height="52" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="515.0" y="222.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Market lockout</text>
<text x="515.0" y="239.0" text-anchor="middle" font-size="13" fill="#18181b">Repudiate 48 turns, Restructure 16 turns</text>
<path d="M180,275 L225,275 L225,226 L270,226" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="270" y="266" width="490" height="52" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="515.0" y="288.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Scar on bond demand</text>
<text x="515.0" y="305.0" text-anchor="middle" font-size="13" fill="#18181b">fades over 100 turns</text>
<path d="M180,275 L225,275 L225,292 L270,292" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="270" y="332" width="490" height="52" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="515.0" y="354.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Recovery</text>
<text x="515.0" y="371.0" text-anchor="middle" font-size="13" fill="#18181b">at least 48 turns, plus 5 disciplined fiscal turns</text>
<path d="M180,275 L225,275 L225,358 L270,358" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
</svg>
