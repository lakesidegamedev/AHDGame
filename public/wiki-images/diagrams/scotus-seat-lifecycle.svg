<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" font-family="system-ui, sans-serif">
<title>Supreme Court seat lifecycle</title>
<desc>A seat goes vacant, the President nominates, the Senate votes for 24 hours, the justice is seated, and eventually departs, leaving the seat vacant again.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="719" height="259" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<g fill="#18181b">
<rect x="24" y="40" width="120" height="70" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="84.0" y="79.2" font-size="12" text-anchor="middle">Seat vacant</text>
<rect x="204" y="40" width="120" height="70" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="264.0" y="71.2" font-size="12" text-anchor="middle" font-weight="700">President</text>
<text x="264.0" y="87.2" font-size="12" text-anchor="middle">nominates</text>
<rect x="384" y="40" width="120" height="70" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="444.0" y="63.2" font-size="12" text-anchor="middle" font-weight="700">Senate vote</text>
<text x="444.0" y="79.2" font-size="12" text-anchor="middle">24 hours,</text>
<text x="444.0" y="95.2" font-size="12" text-anchor="middle">simple majority</text>
<rect x="564" y="40" width="120" height="70" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="624.0" y="79.2" font-size="12" text-anchor="middle">Justice seated</text>
<polyline points="144,75 204,75" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<polyline points="324,75 384,75" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<polyline points="504,75 564,75" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="534" y="66" font-size="12" text-anchor="middle" fill="#52525b">passes</text>
<polyline points="444,110 444,150 70,150 70,110" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="257" y="142" font-size="12" text-anchor="middle" fill="#52525b">rejected: the seat stays vacant</text>
<polyline points="624,110 624,200 110,200 110,110" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#mn)"/>
<text x="367" y="192" font-size="12" text-anchor="middle" fill="#52525b">departs: authored departure year or leaves mid-term</text>
<text x="360" y="236" font-size="12" text-anchor="middle" fill="#52525b">Replacements are never automatic: every one is nominated and confirmed.</text>
</g>
</svg>
