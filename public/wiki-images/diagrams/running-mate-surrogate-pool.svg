<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" role="img" font-family="system-ui, sans-serif"><title>Running mate surrogate actions</title><desc>A shared daily pool of two surrogate actions pays for a state visit or a canvass; each also costs the running mate's own actions, a canvass also costs campaign funds, and the pool refills at midnight Eastern.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="779" height="359" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="250" y="20" width="260" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="380.0" y="51.0" font-size="13" text-anchor="middle" fill="#18181b">Daily pool: 2 surrogate actions</text><rect x="30" y="130" width="320" height="110" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="190.0" y="164.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">State visit</text><text x="190.0" y="180.0" font-size="13" text-anchor="middle" fill="#18181b">1 from the pool</text><text x="190.0" y="196.0" font-size="13" text-anchor="middle" fill="#18181b">3 to 10 of the running mate's own actions,</text><text x="190.0" y="212.0" font-size="13" text-anchor="middle" fill="#18181b">by the state's electoral votes</text><rect x="410" y="130" width="310" height="110" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="565.0" y="164.0" font-size="13" text-anchor="middle" fill="#18181b" font-weight="bold">Canvass for the ticket</text><text x="565.0" y="180.0" font-size="13" text-anchor="middle" fill="#18181b">1 from the pool</text><text x="565.0" y="196.0" font-size="13" text-anchor="middle" fill="#18181b">1 of the running mate's own actions</text><text x="565.0" y="212.0" font-size="13" text-anchor="middle" fill="#18181b">₳100 in campaign funds</text><rect x="250" y="290" width="260" height="50" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="380.0" y="318.0" font-size="13" text-anchor="middle" fill="#18181b">Pool empty: actions blocked</text><path d="M330 76 L330 103 L190 103 L190 130" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="260" y="97" font-size="12" text-anchor="middle" fill="#52525b">spends 1</text><path d="M430 76 L430 103 L565 103 L565 130" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="500" y="97" font-size="12" text-anchor="middle" fill="#52525b">spends 1</text><path d="M190 240 L190 305 L250 305" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arw)"/><path d="M565 240 L565 305 L510 305" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arw)"/><path d="M510 328 L755 328 L755 48 L510 48" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="640" y="345" font-size="12" text-anchor="middle" fill="#52525b">refills at midnight Eastern</text></svg>