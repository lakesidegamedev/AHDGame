<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" font-family="system-ui, sans-serif"><title>Life of an election</title><desc>An election spawns, candidates declare, primary standings are scored and ballots counted, the primary resolves, general votes accumulate, the general resolves and the next cycle spawns.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="799" height="359" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="40" width="160" height="70" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="100.0" y="78.0" font-size="13" text-anchor="middle" fill="#18181b">Cycle spawns</text><rect x="215" y="40" width="160" height="70" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="295.0" y="78.0" font-size="13" text-anchor="middle" fill="#18181b">Declaration window</text><rect x="410" y="40" width="195" height="90" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="507.5" y="64.0" font-size="13" text-anchor="middle" fill="#18181b">Primary: standings</text><text x="507.5" y="80.0" font-size="13" text-anchor="middle" fill="#18181b">scored each turn;</text><text x="507.5" y="96.0" font-size="13" text-anchor="middle" fill="#18181b">ballots count in the</text><text x="507.5" y="112.0" font-size="13" text-anchor="middle" fill="#18181b">closing stretch</text><rect x="640" y="40" width="140" height="90" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="710.0" y="72.0" font-size="13" text-anchor="middle" fill="#18181b">Primary resolves;</text><text x="710.0" y="88.0" font-size="13" text-anchor="middle" fill="#18181b">winner moves to</text><text x="710.0" y="104.0" font-size="13" text-anchor="middle" fill="#18181b">the general</text><rect x="20" y="220" width="195" height="80" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="117.5" y="255.0" font-size="13" text-anchor="middle" fill="#18181b">General: votes</text><text x="117.5" y="271.0" font-size="13" text-anchor="middle" fill="#18181b">accumulate turn by turn</text><rect x="250" y="220" width="195" height="80" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="347.5" y="255.0" font-size="13" text-anchor="middle" fill="#18181b">General resolves;</text><text x="347.5" y="271.0" font-size="13" text-anchor="middle" fill="#18181b">winners take office</text><rect x="480" y="220" width="195" height="80" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="577.5" y="263.0" font-size="13" text-anchor="middle" fill="#18181b">Next cycle spawns</text><path d="M180 75 L215 75" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M375 75 L410 75" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M605 85 L640 85" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M710 130 L710 175 L117 175 L117 220" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M215 260 L250 260" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M445 260 L480 260" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="410" y="168" font-size="12" text-anchor="middle" fill="#52525b">primary winner goes on to face the other parties</text><text x="20" y="340" font-size="12" text-anchor="start" fill="#52525b">Presidential primaries use staggered state voting and delegate waves, with a convention if nobody holds a majority.</text></svg>