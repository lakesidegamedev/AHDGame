<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" font-family="system-ui, sans-serif">
<title>IMF sovereign facility loan flow</title>
<desc>After failed auctions the executive picks Bailout, the loan is sized, a board window opens, and each turn a capped payment is made; unpaid interest capitalizes; the facility closes at zero.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker></defs>
<rect x="0.5" y="0.5" width="779" height="469" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="36" width="165" height="100" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.25"/>
<text x="102.5" y="73.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">1. Crisis</text>
<text x="102.5" y="90.5" text-anchor="middle" font-size="13" fill="#18181b">Three failed</text>
<text x="102.5" y="107.5" text-anchor="middle" font-size="13" fill="#18181b">auctions in a row</text>
<rect x="205" y="36" width="165" height="100" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="287.5" y="65.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">2. Bailout</text>
<text x="287.5" y="82.0" text-anchor="middle" font-size="13" fill="#18181b">Executive picks it;</text>
<text x="287.5" y="99.0" text-anchor="middle" font-size="13" fill="#18181b">the legislature</text>
<text x="287.5" y="116.0" text-anchor="middle" font-size="13" fill="#18181b">approves</text>
<rect x="390" y="36" width="165" height="100" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="472.5" y="56.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">3. Loan sized</text>
<text x="472.5" y="73.5" text-anchor="middle" font-size="13" fill="#18181b">Bonds due within 12</text>
<text x="472.5" y="90.5" text-anchor="middle" font-size="13" fill="#18181b">turns plus the</text>
<text x="472.5" y="107.5" text-anchor="middle" font-size="13" fill="#18181b">projected yearly</text>
<text x="472.5" y="124.5" text-anchor="middle" font-size="13" fill="#18181b">deficit</text>
<rect x="575" y="36" width="165" height="100" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="657.5" y="65.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">4. Board window</text>
<text x="657.5" y="82.0" text-anchor="middle" font-size="13" fill="#18181b">12 turns; one</text>
<text x="657.5" y="99.0" text-anchor="middle" font-size="13" fill="#18181b">action: change terms</text>
<text x="657.5" y="116.0" text-anchor="middle" font-size="13" fill="#18181b">or post a statement</text>
<path d="M185,86 L205,86" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M370,86 L390,86" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M555,86 L575,86" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<path d="M657,136 L657,200" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="575" y="200" width="165" height="96" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
<text x="657.5" y="218.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">5. Each turn</text>
<text x="657.5" y="235.5" text-anchor="middle" font-size="13" fill="#18181b">Pay the fixed</text>
<text x="657.5" y="252.5" text-anchor="middle" font-size="13" fill="#18181b">payment, capped at a</text>
<text x="657.5" y="269.5" text-anchor="middle" font-size="13" fill="#18181b">share of that turn's</text>
<text x="657.5" y="286.5" text-anchor="middle" font-size="13" fill="#18181b">revenue</text>
<path d="M575,248 L510,248" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<rect x="310" y="218" width="200" height="60" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25"/>
<text x="410.0" y="244.0" text-anchor="middle" font-size="13" fill="#18181b">Does the capped payment</text>
<text x="410.0" y="261.0" text-anchor="middle" font-size="13" fill="#18181b">cover the interest?</text>
<path d="M310,248 L210,248" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ma)"/>
<text x="260" y="240" text-anchor="middle" font-size="12" fill="#52525b" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">yes</text>
<rect x="20" y="218" width="190" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
<text x="115.0" y="235.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Balance falls</text>
<text x="115.0" y="252.5" text-anchor="middle" font-size="13" fill="#18181b">until it reaches zero</text>
<text x="115.0" y="269.5" text-anchor="middle" font-size="13" fill="#18181b">and the facility closes</text>
<path d="M410,278 L410,340" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mw)"/>
<text x="418" y="312" text-anchor="start" font-size="12" fill="#52525b" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">no</text>
<rect x="310" y="340" width="200" height="90" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.25"/>
<text x="410.0" y="355.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Capitalizes</text>
<text x="410.0" y="372.5" text-anchor="middle" font-size="13" fill="#18181b">unpaid interest is added</text>
<text x="410.0" y="389.5" text-anchor="middle" font-size="13" fill="#18181b">to the loan; the</text>
<text x="410.0" y="406.5" text-anchor="middle" font-size="13" fill="#18181b">repayment clock does not</text>
<text x="410.0" y="423.5" text-anchor="middle" font-size="13" fill="#18181b">advance</text>
<path d="M510,380 L657,380 L657,296" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mw)"/>
<text x="584" y="374" text-anchor="middle" font-size="12" fill="#52525b" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">next turn</text>
<rect x="20" y="340" width="250" height="80" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="145.0" y="359.0" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Recovery clock</text>
<text x="145.0" y="376.0" text-anchor="middle" font-size="13" fill="#18181b">starts at the bailout and runs</text>
<text x="145.0" y="393.0" text-anchor="middle" font-size="13" fill="#18181b">separately: at least 48 turns</text>
<text x="145.0" y="410.0" text-anchor="middle" font-size="13" fill="#18181b">plus 5 disciplined fiscal turns</text>
</svg>
