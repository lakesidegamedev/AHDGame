<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" font-family="system-ui, sans-serif">
<title>How a no-confidence vote plays out</title>
<desc>A motion is filed and voted for 24 hours; if it passes the PM is removed and the government pending with a 96 turn clock, otherwise the PM stays and a 48 turn filing cooldown runs.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="339" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<g fill="#18181b">
<rect x="24" y="100" width="140" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="94.0" y="120.2" font-size="12" text-anchor="middle" font-weight="700">Motion filed</text>
<text x="94.0" y="136.2" font-size="12" text-anchor="middle">by a lower-chamber</text>
<text x="94.0" y="152.2" font-size="12" text-anchor="middle">member</text>
<rect x="214" y="100" width="170" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="299.0" y="120.2" font-size="12" text-anchor="middle" font-weight="700">24 hour vote</text>
<text x="299.0" y="136.2" font-size="12" text-anchor="middle">Aye needs a majority</text>
<text x="299.0" y="152.2" font-size="12" text-anchor="middle">of all seats</text>
<polyline points="164,132 214,132" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="434" y="30" width="170" height="64" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="519.0" y="50.2" font-size="12" text-anchor="middle" font-weight="700">Passes</text>
<text x="519.0" y="66.2" font-size="12" text-anchor="middle">PM removed;</text>
<text x="519.0" y="82.2" font-size="12" text-anchor="middle">government pending</text>
<rect x="654" y="30" width="126" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="717.0" y="50.2" font-size="12" text-anchor="middle" font-weight="700">Appointment</text>
<text x="717.0" y="66.2" font-size="12" text-anchor="middle">votes; 96 turn</text>
<text x="717.0" y="82.2" font-size="12" text-anchor="middle">clock</text>
<polyline points="384,118 409,118 409,62 434,62" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<polyline points="604,62 654,62" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="560" y="130" width="100" height="52" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="610.0" y="160.2" font-size="12" text-anchor="middle">PM seated</text>
<rect x="680" y="130" width="100" height="52" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="730.0" y="152.2" font-size="12" text-anchor="middle" font-weight="700">Snap</text>
<text x="730.0" y="168.2" font-size="12" text-anchor="middle">election</text>
<polyline points="690,94 690,112 610,112 610,130" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<polyline points="740,94 740,130" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="402" y="92" font-size="12" text-anchor="end" fill="#52525b">passes</text>
<rect x="434" y="230" width="170" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="519.0" y="250.2" font-size="12" text-anchor="middle" font-weight="700">Fails</text>
<text x="519.0" y="266.2" font-size="12" text-anchor="middle">PM stays; votes filed</text>
<text x="519.0" y="282.2" font-size="12" text-anchor="middle">are cancelled</text>
<rect x="654" y="230" width="126" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="717.0" y="250.2" font-size="12" text-anchor="middle" font-weight="700">48 turn cooldown</text>
<text x="717.0" y="266.2" font-size="12" text-anchor="middle">before the next</text>
<text x="717.0" y="282.2" font-size="12" text-anchor="middle">motion</text>
<polyline points="384,146 409,146 409,262 434,262" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#mn)"/>
<text x="402" y="200" font-size="12" text-anchor="end" fill="#52525b">fails</text>
<polyline points="604,262 654,262" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#mn)"/>
<text x="24" y="316" font-size="12" text-anchor="start" fill="#52525b">The cooldown is counted from the day the motion was filed, pass or fail.</text>
</g>
</svg>
