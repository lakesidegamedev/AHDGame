<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" font-family="system-ui, sans-serif"><title>Who qualifies for a subsidy</title><desc>A sector passes the territory, sector type, strategy and domestic-only filters; each qualifying subsidy adds 7.5 points of margin, and the government pays a cost each turn into the sectorSubsidies budget line.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="759" height="419" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="20" width="340" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="190.0" y="45.0" font-size="13" text-anchor="middle" fill="#18181b">Corporation sector</text><path d="M190 64 L190 84" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="20" y="84" width="340" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="190.0" y="109.0" font-size="13" text-anchor="middle" fill="#18181b">Territory: right country or state</text><path d="M190 128 L190 148" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="20" y="148" width="340" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="190.0" y="165.0" font-size="13" text-anchor="middle" fill="#18181b">Sector type: matches, if the subsidy names</text><text x="190.0" y="181.0" font-size="13" text-anchor="middle" fill="#18181b">one</text><path d="M190 192 L190 212" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="20" y="212" width="340" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="190.0" y="237.0" font-size="13" text-anchor="middle" fill="#18181b">Strategy: matches, if the subsidy names one</text><path d="M190 256 L190 276" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="20" y="276" width="340" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="190.0" y="293.0" font-size="13" text-anchor="middle" fill="#18181b">Domestic only: headquarters in the territory,</text><text x="190.0" y="309.0" font-size="13" text-anchor="middle" fill="#18181b">if required</text><path d="M190 320 L190 340" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><rect x="20" y="340" width="340" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="190.0" y="357.0" font-size="13" text-anchor="middle" fill="#18181b">Qualifies: each match adds 7.5 points of</text><text x="190.0" y="373.0" font-size="13" text-anchor="middle" fill="#18181b">margin</text><text x="200" y="56" font-size="12" text-anchor="middle" fill="#52525b"></text><rect x="450" y="300" width="290" height="50" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="595.0" y="328.0" font-size="13" text-anchor="middle" fill="#18181b">Cost each turn: revenue x 48 x 0.105</text><rect x="450" y="150" width="290" height="60" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="595.0" y="175.0" font-size="13" text-anchor="middle" fill="#18181b">Budget line: spending on</text><text x="595.0" y="191.0" font-size="13" text-anchor="middle" fill="#18181b">sectorSubsidies, federal or state</text><path d="M360 362 L405 362 L405 325 L450 325" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arw)"/><text x="405" y="398" font-size="12" text-anchor="middle" fill="#52525b">government pays</text><path d="M595 300 L595 210" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arw)"/></svg>