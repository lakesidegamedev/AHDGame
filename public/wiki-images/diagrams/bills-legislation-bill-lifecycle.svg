<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400" role="img" font-family="system-ui, sans-serif">
<title>Bill lifecycle</title>
<desc>A bill is filed, voted on in the origin chamber then the second chamber, then either goes to the president (sign, veto, override) or through a cabinet stage in parliamentary countries.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="739" height="399" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<g fill="#18181b">
<rect x="24" y="40" width="110" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="79.0" y="72.5" font-size="13" text-anchor="middle">File bill</text>
<rect x="174" y="40" width="150" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="249.0" y="64.0" font-size="13" text-anchor="middle" font-weight="700">Origin chamber</text>
<text x="249.0" y="81.0" font-size="13" text-anchor="middle">24 hour vote</text>
<rect x="364" y="40" width="150" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="439.0" y="64.0" font-size="13" text-anchor="middle" font-weight="700">Second chamber</text>
<text x="439.0" y="81.0" font-size="13" text-anchor="middle">24 hour vote</text>
<rect x="554" y="40" width="162" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="635.0" y="64.0" font-size="13" text-anchor="middle" font-weight="700">Passed the</text>
<text x="635.0" y="81.0" font-size="13" text-anchor="middle">legislature</text>
<polyline points="134,68 174,68" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<polyline points="324,68 364,68" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<polyline points="514,68 554,68" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="24" y="116" font-size="12" text-anchor="start" fill="#52525b">Unicameral countries skip the second</text>
<text x="24" y="132" font-size="12" text-anchor="start" fill="#52525b">chamber. A US Senate filibuster adds</text>
<text x="24" y="148" font-size="12" text-anchor="start" fill="#52525b">about 12 hours to a Senate vote.</text>
<rect x="250" y="170" width="190" height="52" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="345.0" y="192.1" font-size="13" text-anchor="middle" font-weight="700">President</text>
<text x="345.0" y="209.1" font-size="13" text-anchor="middle">10 hour window</text>
<rect x="540" y="170" width="176" height="52" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="628.0" y="192.1" font-size="13" text-anchor="middle" font-weight="700">Cabinet stage</text>
<text x="628.0" y="209.1" font-size="13" text-anchor="middle">then enacted, no veto</text>
<polyline points="635,96 635,170" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="643" y="138" font-size="12" text-anchor="start" fill="#52525b">parliamentary</text>
<polyline points="635,96 635,110 345,110 345,170" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="353" y="150" font-size="12" text-anchor="start" fill="#52525b">presidential</text>
<rect x="24" y="170" width="180" height="60" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="114.0" y="196.1" font-size="13" text-anchor="middle" font-weight="700">Veto override vote</text>
<text x="114.0" y="213.1" font-size="13" text-anchor="middle">needs 2/3 of all seats</text>
<rect x="24" y="300" width="120" height="44" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="84.0" y="326.6" font-size="13" text-anchor="middle">Bill dies</text>
<rect x="560" y="300" width="156" height="52" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="638.0" y="330.6" font-size="13" text-anchor="middle">Enacted</text>
<polyline points="250,196 204,196" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="227" y="188" font-size="12" text-anchor="middle" fill="#52525b">vetoes</text>
<polyline points="345,222 345,326 560,326" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="452" y="318" font-size="12" text-anchor="middle" fill="#52525b">signs, or no action (auto-sign)</text>
<polyline points="84,230 84,300" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="92" y="270" font-size="12" text-anchor="start" fill="#52525b">falls short</text>
<polyline points="160,230 160,360 600,360 600,352" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="380" y="376" font-size="12" text-anchor="middle" fill="#52525b">reaches 2/3 of all seats</text>
<polyline points="635,222 635,300" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
</g>
</svg>
