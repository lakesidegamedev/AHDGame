<svg xmlns="http://www.w3.org/2000/svg" width="760" height="286" viewBox="0 0 760 286" role="img" font-family="system-ui, sans-serif">
<title>Household demand flow</title>
<desc>Population sets a household budget, adjusted by unemployment, consumer confidence and median income. Wealth changes the basket mix, price elasticity bends demand per commodity, and a supply cap limits the result into commodity demand.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="285" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="20" width="170" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="105.0" y="44.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Population</text>
<text x="105.0" y="60.5" font-size="12" text-anchor="middle" fill="#3f3f46">times per-person spend</text>
<path d="M105.0 76 L105.0 108" fill="none" stroke="#52525b" stroke-width="1.5"/>
<rect x="205" y="20" width="150" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="280.0" y="44.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Unemployment</text>
<text x="280.0" y="60.5" font-size="12" text-anchor="middle" fill="#3f3f46">lower raises demand</text>
<path d="M280.0 76 L280.0 108" fill="none" stroke="#52525b" stroke-width="1.5"/>
<rect x="370" y="20" width="170" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="455.0" y="44.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Consumer confidence</text>
<text x="455.0" y="60.5" font-size="12" text-anchor="middle" fill="#3f3f46">bounded range</text>
<path d="M455.0 76 L455.0 108" fill="none" stroke="#52525b" stroke-width="1.5"/>
<rect x="555" y="20" width="185" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="647.5" y="44.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Median income</text>
<text x="647.5" y="60.5" font-size="12" text-anchor="middle" fill="#3f3f46">vs its own average</text>
<path d="M647.5 76 L647.5 108" fill="none" stroke="#52525b" stroke-width="1.5"/>
<path d="M84 108 L647 108" fill="none" stroke="#52525b" stroke-width="1.5"/>
<path d="M84 108 L84 138" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="20" y="140" width="128" height="64" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="84.0" y="168.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Adjusted</text>
<text x="84.0" y="184.6" font-size="13" text-anchor="middle" fill="#18181b">budget</text>
<path d="M150 172 L166 172" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="168" y="140" width="128" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="232.0" y="168.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Basket mix</text>
<text x="232.0" y="184.6" font-size="12" text-anchor="middle" fill="#3f3f46">shifts with wealth</text>
<path d="M298 172 L314 172" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="316" y="140" width="128" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="380.0" y="160.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Price</text>
<text x="380.0" y="176.6" font-size="13" text-anchor="middle" fill="#18181b">elasticity</text>
<text x="380.0" y="192.6" font-size="12" text-anchor="middle" fill="#3f3f46">vs the base price</text>
<path d="M446 172 L462 172" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="464" y="140" width="128" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="528.0" y="160.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Supply cap</text>
<text x="528.0" y="176.6" font-size="12" text-anchor="middle" fill="#3f3f46">1.5x last turn's</text>
<text x="528.0" y="192.6" font-size="12" text-anchor="middle" fill="#3f3f46">global supply</text>
<path d="M594 172 L610 172" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="612" y="140" width="128" height="64" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="676.0" y="168.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Commodity</text>
<text x="676.0" y="184.6" font-size="13" text-anchor="middle" fill="#18181b">demand</text>
<text x="380" y="244" font-size="12" text-anchor="middle" fill="#52525b">Wealth changes the mix of the basket, not its size.</text>
</svg>
