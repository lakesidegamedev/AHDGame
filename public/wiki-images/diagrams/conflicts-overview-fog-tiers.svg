<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" font-family="system-ui, sans-serif">
<title>Fog tiers of a conflict</title>
<desc>A matrix of what each visibility tier sees: territory and casualties for everyone, own order of battle and a coarse enemy band at command level, and the enemy order of battle only in the archive.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="719" height="389" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<text x="18" y="28" font-size="15" fill="#18181b" text-anchor="start" font-weight="700">What each tier can see</text>
<rect x="378" y="40" width="104" height="92" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="430.0" y="81.0" font-size="12" fill="#18181b" text-anchor="middle" font-weight="700">Public</text>
<text x="430.0" y="97.0" font-size="12" fill="#18181b" text-anchor="middle">Everyone else</text>
<rect x="488" y="40" width="104" height="92" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="540.0" y="57.0" font-size="12" fill="#18181b" text-anchor="middle" font-weight="700">Command</text>
<text x="540.0" y="73.0" font-size="12" fill="#18181b" text-anchor="middle">Belligerent</text>
<text x="540.0" y="89.0" font-size="12" fill="#18181b" text-anchor="middle">seat holders</text>
<text x="540.0" y="105.0" font-size="12" fill="#18181b" text-anchor="middle">and posted</text>
<text x="540.0" y="121.0" font-size="12" fill="#18181b" text-anchor="middle">generals</text>
<rect x="598" y="40" width="104" height="92" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="650.0" y="57.0" font-size="12" fill="#18181b" text-anchor="middle" font-weight="700">Archive</text>
<text x="650.0" y="73.0" font-size="12" fill="#18181b" text-anchor="middle">Everyone, 480</text>
<text x="650.0" y="89.0" font-size="12" fill="#18181b" text-anchor="middle">turns after</text>
<text x="650.0" y="105.0" font-size="12" fill="#18181b" text-anchor="middle">the war</text>
<text x="650.0" y="121.0" font-size="12" fill="#18181b" text-anchor="middle">resolves</text>
<rect x="20" y="142" width="680" height="38" rx="5" fill="#f4f4f5" stroke="#e4e4e7"/>
<text x="34" y="166" font-size="13" fill="#18181b" text-anchor="start">Territory held</text>
<path d="M423 161 L428 167 L438 154" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M533 161 L538 167 L548 154" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M643 161 L648 167 L658 154" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="184" width="680" height="38" rx="5" fill="#ffffff" stroke="#e4e4e7"/>
<text x="34" y="208" font-size="13" fill="#18181b" text-anchor="start">Casualties</text>
<path d="M423 203 L428 209 L438 196" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M533 203 L538 209 L548 196" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M643 203 L648 209 L658 196" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="226" width="680" height="38" rx="5" fill="#f4f4f5" stroke="#e4e4e7"/>
<text x="34" y="250" font-size="13" fill="#18181b" text-anchor="start">Own order of battle</text>
<path d="M424 239 L436 251 M436 239 L424 251" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>
<path d="M533 245 L538 251 L548 238" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M643 245 L648 251 L658 238" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="268" width="680" height="38" rx="5" fill="#ffffff" stroke="#e4e4e7"/>
<text x="34" y="292" font-size="13" fill="#18181b" text-anchor="start">Enemy strength band</text>
<path d="M424 281 L436 293 M436 281 L424 293" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>
<path d="M533 287 L538 293 L548 280" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M643 287 L648 293 L658 280" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="310" width="680" height="38" rx="5" fill="#f4f4f5" stroke="#e4e4e7"/>
<text x="34" y="334" font-size="13" fill="#18181b" text-anchor="start">Enemy order of battle</text>
<path d="M424 323 L436 335 M436 323 L424 335" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>
<path d="M534 323 L546 335 M546 323 L534 335" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>
<path d="M643 329 L648 335 L658 322" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="20" y="368" font-size="12" fill="#52525b" text-anchor="start">Incoming enemy offensives are hidden at every tier.</text>
</svg>
