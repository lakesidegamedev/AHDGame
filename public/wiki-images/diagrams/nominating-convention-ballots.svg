<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" font-family="system-ui, sans-serif"><title>The multi-ballot convention</title><desc>If no candidate has a majority after the delegate waves, a convention counts delegates; a leader with a majority is nominated, otherwise the last-placed candidate is dropped and their delegates released, and the count repeats.</desc><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71717a"/></marker></defs><rect x="0.5" y="0.5" width="759" height="359" rx="8" fill="#ffffff" stroke="#d4d4d8"/><rect x="20" y="30" width="230" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="135.0" y="45.0" font-size="13" text-anchor="middle" fill="#18181b">Delegate waves finished: does</text><text x="135.0" y="61.0" font-size="13" text-anchor="middle" fill="#18181b">any candidate hold a</text><text x="135.0" y="77.0" font-size="13" text-anchor="middle" fill="#18181b">majority?</text><rect x="560" y="30" width="180" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="650.0" y="61.0" font-size="13" text-anchor="middle" fill="#18181b">Nominated</text><path d="M250 58 L560 58" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="405" y="50" font-size="12" text-anchor="middle" fill="#52525b">yes, no convention needed</text><rect x="20" y="150" width="230" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="135.0" y="165.0" font-size="13" text-anchor="middle" fill="#18181b">Convention counts delegates</text><text x="135.0" y="181.0" font-size="13" text-anchor="middle" fill="#18181b">pledged to each candidate</text><text x="135.0" y="197.0" font-size="13" text-anchor="middle" fill="#18181b">still standing</text><path d="M135 86 L135 150" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="147" y="122" font-size="12" text-anchor="start" fill="#52525b">no</text><rect x="310" y="150" width="250" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="435.0" y="173.0" font-size="13" text-anchor="middle" fill="#18181b">Does the leader hold a majority</text><text x="435.0" y="189.0" font-size="13" text-anchor="middle" fill="#18181b">of the delegates in play?</text><path d="M250 178 L310 178" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M560 178 L650 178 L650 86" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="658" y="128" font-size="12" text-anchor="start" fill="#52525b">yes, or one</text><text x="658" y="144" font-size="12" text-anchor="start" fill="#52525b">candidate left</text><rect x="310" y="270" width="250" height="56" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="435.0" y="301.0" font-size="13" text-anchor="middle" fill="#18181b">Drop the last-placed candidate</text><path d="M435 206 L435 270" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arn)"/><text x="447" y="242" font-size="12" text-anchor="start" fill="#52525b">no</text><rect x="20" y="270" width="230" height="56" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/><text x="135.0" y="293.0" font-size="13" text-anchor="middle" fill="#18181b">Release their delegates by</text><text x="135.0" y="309.0" font-size="13" text-anchor="middle" fill="#18181b">affinity and endorsement</text><path d="M310 298 L250 298" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><path d="M135 270 L135 206" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ara)"/><text x="147" y="242" font-size="12" text-anchor="start" fill="#52525b">ballot again</text></svg>