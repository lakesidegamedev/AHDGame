<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" font-family="system-ui, sans-serif">
<title>Sourcing by landed price</title>
<desc>Local, cross-state and import sources are ranked by landed price (seller ask plus shipping plus tariff). The cheapest eligible source fills first if it is inside the buyer tolerance ceiling; anything over it is rejected and recorded as unmet.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="299" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="20" width="240" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="140.0" y="49.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Local supply</text>
<text x="140.0" y="65.5" font-size="12" text-anchor="middle" fill="#3f3f46">seller ask</text>
<path d="M262 53 L284 53 L284 142 L310 142" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="20" y="110" width="240" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="140.0" y="131.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Cross-state haul</text>
<text x="140.0" y="147.6" font-size="12" text-anchor="middle" fill="#3f3f46">ask + shipping, with a</text>
<text x="140.0" y="163.6" font-size="12" text-anchor="middle" fill="#3f3f46">surcharge over fleet capacity</text>
<path d="M262 143 L284 143 L284 142 L310 142" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="20" y="200" width="240" height="66" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="140.0" y="221.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Import</text>
<text x="140.0" y="237.6" font-size="12" text-anchor="middle" fill="#3f3f46">ask + shipping (flat sea-hop</text>
<text x="140.0" y="253.6" font-size="12" text-anchor="middle" fill="#3f3f46">equivalent) + tariff</text>
<path d="M262 233 L284 233 L284 142 L310 142" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="312" y="100" width="170" height="84" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="397.0" y="130.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Rank by</text>
<text x="397.0" y="146.6" font-size="13" text-anchor="middle" fill="#18181b">landed price</text>
<text x="397.0" y="162.6" font-size="12" text-anchor="middle" fill="#3f3f46">ask + shipping + tariff</text>
<text x="397" y="222" font-size="12" text-anchor="middle" fill="#52525b">Embargoes remove a route;</text>
<text x="397" y="238" font-size="12" text-anchor="middle" fill="#52525b">tariffs only raise its price.</text>
<rect x="540" y="100" width="200" height="84" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
<text x="640.0" y="130.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Inside the tolerance</text>
<text x="640.0" y="146.6" font-size="13" text-anchor="middle" fill="#18181b">ceiling?</text>
<text x="640.0" y="162.6" font-size="12" text-anchor="middle" fill="#3f3f46">local price plus slack</text>
<path d="M484 142 L538 142" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<rect x="540" y="16" width="200" height="60" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="640.0" y="42.5" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Cheapest fills first</text>
<text x="640.0" y="58.5" font-size="12" text-anchor="middle" fill="#3f3f46">up to demand and supply</text>
<path d="M640 100 L640 78" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ma)"/>
<text x="650" y="94" font-size="12" text-anchor="start" fill="#52525b">yes</text>
<rect x="540" y="208" width="200" height="56" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="640.0" y="232.6" font-size="13" text-anchor="middle" fill="#18181b" font-weight="700">Rejected</text>
<text x="640.0" y="248.6" font-size="12" text-anchor="middle" fill="#3f3f46">recorded as unmet</text>
<path d="M640 184 L640 206" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#mw)"/>
<text x="650" y="200" font-size="12" text-anchor="start" fill="#52525b">no</text>
</svg>
